<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>ERNTE – prihlásenie heslom</title>
<style>body{margin:0;background:#05070a;color:#f2f5ff;font:16px/1.5 -apple-system,system-ui,sans-serif;padding:20px}.w{max-width:600px;margin:0 auto;display:grid;gap:16px}
button,a.b{display:flex;align-items:center;justify-content:center;font:700 1.1rem system-ui;min-height:64px;border-radius:16px;border:0;background:linear-gradient(135deg,#7c5cff,#22d3ee);color:#fff;text-decoration:none}
button.ok{background:linear-gradient(135deg,#b6ff3b,#5eead4);color:#06110a}a.b{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2)}ol{margin:0;padding-left:22px;color:#9aa3b8}</style></head>
<body><div class="w"><h1 style="margin:0">Prihlásenie farmárov heslom</h1>
<button id="c">1. Kopírovať SQL</button>
<a class="b" href="https://supabase.com/dashboard/project/cflliscddsgleyeykzje/sql/new">2. Otvoriť SQL Editor</a>
<ol><li>V SQL Editore ťukni do prázdneho poľa, podrž prst → <b>Vložiť</b>.</li><li>Ťukni <b>Run</b>. Má sa ukázať „Success“.</li></ol>
<a class="b" href="index.html">3. Otvoriť aplikáciu</a></div>
<script>let T="";fetch("supabase/login.sql?"+Date.now()).then(r=>r.text()).then(t=>T=t);
c.onclick=()=>{if(!T){alert("Ešte sa načítava, skús o sekundu.");return}navigator.clipboard.writeText(T).then(()=>{c.textContent="Skopírované ✓";c.className="ok"}).catch(e=>alert("Nevyšlo: "+e.message))}</script></body></html>
