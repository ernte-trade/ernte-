:root{

  color-scheme:dark;
}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 22px rgba(34,211,238,.30);transition:transform .38s cubic-bezier(.2,.8,.2,1),width .38s cubic-bezier(.2,.8,.2,1),height .38s ease}

}

/* --- podzáložky Flotily: sklenená lišta s posuvným zvýraznením --- */

  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));-webkit-backdrop-filter:var(--ds-blur);backdrop-filter:var(--ds-blur);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),var(--ds-shadow)}

.vnav button:active{transform:scale(.97)}

/* --- KPI karty so sparkline --- */

.ds-kpi.bad{box-shadow:inset 0 2px 0 rgba(248,113,113,.85),inset 0 1px 0 rgba(255,255,255,.28),0 0 26px rgba(248,113,113,.18),var(--ds-shadow)}.ds-kpi.bad>b{color:#fca5a5}
.ds-kpi.acc{box-shadow:inset 0 2px 0 rgba(34,211,238,.75),inset 0 1px 0 rgba(255,255,255,.28),var(--ds-shadow)}

.xai.b{border-left-color:var(--ds-acc);box-shadow:-4px 0 18px -6px rgba(34,211,238,.8),inset 6px 0 18px -10px rgba(34,211,238,.55);background:linear-gradient(90deg,rgba(34,211,238,.09),rgba(255,255,255,.03))}.xai.b>span{background:rgba(34,211,238,.15)}
.xai div,.xai small{min-width:0;overflow-wrap:anywhere}
.xals .r{color:#fca5a5;border-color:rgba(248,113,113,.5)}.xals .w{color:#fcd34d;border-color:rgba(251,191,36,.5)}.xals .b{color:#67e8f9;border-color:rgba(34,211,238,.5)}
.al{border-radius:14px}.al.r{background:rgba(248,113,113,.10);border-color:var(--ds-bad);box-shadow:-3px 0 14px -6px rgba(248,113,113,.8)}.al.w{background:rgba(251,191,36,.08);border-color:var(--ds-warn)}.al.b{background:rgba(34,211,238,.08);border-color:var(--ds-acc)}

/* --- tabuľky: sklenené riadky, sticky hlavička, na mobile karty --- */
.dcr{border-top:1px solid rgba(255,255,255,.07);padding:7px 6px;border-radius:10px}

  .dct .dcr:not(.hd)>span[data-l]:not(:first-child)::before{content:attr(data-l);color:var(--muted);font:600 .64rem var(--f-ui);text-transform:uppercase;letter-spacing:.04em;text-align:left}
}
.xvk span,.vk span,.yfb span{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);min-width:0}

/* --- mapa: svietiace body, sklenená bublina --- */
.lpin i{background:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.28),0 0 14px #60a5fa}

@keyframes ds-pulse{50%{box-shadow:0 0 0 7px rgba(52,211,153,.12),0 0 22px #34d399}}
.lmap{border-radius:18px;border:1px solid var(--ds-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:16px}
.leaflet-popup-content-wrapper{text-align:left;border-radius:14px;color:#f1f5ff;border:1px solid rgba(255,255,255,.22);background:rgba(20,28,51,.82);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 30px rgba(0,0,0,.5)}
.leaflet-popup-content{margin:9px 12px;font:600 12px/1.45 var(--f-ui);white-space:nowrap}.leaflet-popup-content b{color:#fff}

.leaflet-container a.leaflet-popup-close-button{display:none}
.xmh span{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.ds-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted)}.ds-leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

/* --- spoločné riadky/čipy --- */
.ds-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.ds-chip{display:grid;gap:1px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);min-width:0}

.ds-chip b{font:800 .98rem var(--f-num);overflow-wrap:anywhere}.ds-chip b.pos{color:var(--ds-ok)}.ds-chip b.neg{color:var(--ds-bad)}.ds-chip b.na{color:var(--ds-gray);font-style:italic;font-weight:600}
.ds-chip.ow{border-color:rgba(139,92,246,.35);background:rgba(139,92,246,.08)}
.ds-hd{display:flex;align-items:center;gap:10px;min-width:0}.ds-hd>.ds-ttl{flex:1;min-width:0;display:grid}.ds-hd>.ds-ttl b{font:700 1rem var(--f-head);overflow-wrap:anywhere}.ds-hd>.ds-ttl small{color:var(--muted);font-size:.76rem;overflow-wrap:anywhere}.ds-hd>.pill{flex:none}
.ds-team>.ds-fc{align-content:start}.ds-team .btns{align-items:flex-start;align-content:flex-start}.ds-hd{flex-wrap:wrap}.ds-hd>.ds-ttl{flex:1 1 150px}.ds-hd>.pill{flex:0 1 auto;max-width:100%;white-space:normal;text-align:center}.ds-hd>.ds-ttl b,.ds-hd>.ds-ttl small{word-break:normal;overflow-wrap:break-word}
.ds-av{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font:800 .88rem var(--f-ui);color:#04121a;background:linear-gradient(135deg,#a5f3fc,#c4b5fd);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 18px rgba(34,211,238,.25)}
.ds-ic{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.2rem;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.pav{background:linear-gradient(135deg,#a5f3fc,#c4b5fd);color:#04121a;box-shadow:0 6px 18px rgba(34,211,238,.25)}

/* --- Doprava: karty / tabuľka --- */
.ds-trips{display:grid;gap:10px}
.ds-trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;padding:14px 16px;align-items:start}

.ds-trow .c-route{grid-column:1/-1;grid-row:2}.ds-trow .c-st{grid-column:1/-1;grid-row:1;justify-self:start;display:flex;align-items:center;gap:8px}

.ds-trow .c-route .rt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:.84rem;color:var(--ink)}

.ds-trow details.c-more{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px}
.ds-trow details.c-more summary{cursor:pointer;font-size:.8rem;font-weight:700;color:var(--ds-acc);min-height:32px;display:flex;align-items:center}
.ds-trow details.c-more .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:6px}
.ds-trow.zr{opacity:.7}
.ds-th{display:none}

}

/* --- Farmári --- */
.ds-search{position:relative}.ds-search input{padding-left:42px}.ds-search::before{content:"🔎";position:absolute;left:14px;bottom:13px;font-size:1rem;opacity:.75;pointer-events:none}
.ds-fc{display:grid;gap:10px;padding:14px 16px}
.ds-meta{display:flex;flex-wrap:wrap;gap:6px}
.ds-meta>*{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font:600 .74rem var(--f-ui);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--ink);text-decoration:none;max-width:100%;overflow-wrap:anywhere}
.ds-meta a{color:#a5f3fc;border-color:rgba(34,211,238,.35)}

/* --- Počasie --- */
.ds-wx{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ds-wd{display:grid;gap:4px;padding:12px;border-radius:18px;min-width:0;align-content:start}
.ds-wd .dn{font:700 .8rem var(--f-ui);text-transform:capitalize}.ds-wd .di{font-size:1.7rem;line-height:1.1}
.ds-wd .tt{font:800 1.2rem var(--f-num)}.ds-wd .tt span{color:var(--muted);font-weight:600;font-size:.9rem}
.ds-wd .bar{margin:2px 0}
.ds-wd small{font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.ds-wd small b{color:var(--ink);font-weight:700}.ds-wd small{flex-wrap:wrap}.ds-wd small b{margin-left:auto;text-align:right}.ds-wd .bar{display:block;flex:none;width:100%}
.card .out,.sub .out,.row .out{width:auto!important;min-width:0;padding:0 14px!important;border-radius:12px!important;min-height:40px}.card .out .ot{display:inline}
.ds-wd.today{border-color:rgba(34,211,238,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(34,211,238,.35),0 0 26px rgba(34,211,238,.25)}
.ds-wd.w{border-color:rgba(251,191,36,.6)}.ds-wd.r{border-color:rgba(248,113,113,.7)}
.ds-warns{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ds-wn{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border-radius:16px;border:1px solid;border-left-width:3px}
.ds-wn>span{font-size:1.3rem;text-align:center}.ds-wn b{display:block;font-size:.88rem}.ds-wn small{font-size:.74rem;color:var(--ink);opacity:.85}
.ds-wn.w{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.09);box-shadow:-4px 0 16px -6px rgba(251,191,36,.8)}.ds-wn.w b{color:#fcd34d}
.ds-wn.r{border-color:rgba(248,113,113,.6);background:rgba(248,113,113,.10);box-shadow:-4px 0 16px -6px rgba(248,113,113,.85)}.ds-wn.r b{color:#fca5a5}
.wxh{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px}
.wxh:first-child{background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.6)}
.bar i{background:linear-gradient(90deg,#22d3ee,#34d399,#fbbf24);box-shadow:0 0 10px rgba(34,211,238,.35)}

/* --- Tím --- */
.ds-team{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}

/* --- svetlé prvky z predošlého dizajnu zladené --- */
.seg2 button[aria-pressed=true],.pymon button[aria-pressed=true]{background:linear-gradient(135deg,rgba(34,211,238,.35),rgba(139,92,246,.32));color:#fff;border-color:rgba(165,243,252,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 18px rgba(34,211,238,.25)}
.lsw button.on{background:linear-gradient(135deg,#22d3ee,#8b5cf6);color:#fff}
.hbtn,.rbtn{min-height:40px}
.xring{background:conic-gradient(#22d3ee calc(var(--p)*1%),rgba(255,255,255,.08) 0);box-shadow:0 0 30px rgba(34,211,238,.3)}.xring b{color:#a5f3fc}
.ds-theme{min-height:40px;width:40px;padding:0;border-radius:50%;font-size:1rem}
.hrow{align-items:center}

/* --- fallback bez backdrop-filter --- */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .card,.kb,.vd,.xv,.xd,.pyc,.xc,.xmap,.xtl,.vfirm,.vt,.ds-g,.ds-kpi,.ds-tile,.ds-trow,.ds-fc,.tabs,.vnav,.xal,.leaflet-popup-content-wrapper{background:var(--ds-fallback)}
}
/* --- menej pohybu --- */
@media (prefers-reduced-motion:reduce){
  .card::after,.kb::after,.vd::after,.xv::after,.xd::after,.pyc::after,.xc::after,.xmap::after,.xtl::after,.vfirm::after,.vt::after,.ds-g::after,.ds-kpi::after,.ds-tile::after,.ds-trow::after,.ds-fc::after{display:none;animation:none!important}
  .card,.kb,.vd,.xv,.xd,.pyc,.xc,.vt,.ds-kpi,.ds-tile,.ds-trow,.ds-fc,.ds-ind,.tabs button{transition:none!important;transform:none!important}
  .lpin.mv i,.live{animation:none}
}
/* --- tlač: biela, bez skla --- */
@media print{
  html,body{background:#fff!important}body::before{display:none!important}
  *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;animation:none!important}
  .tabs,.vnav,.toast,.hrow{display:none!important}
}

/* ===== SVETLÝ REŽIM ===== */

/* ===== Flotila: 7 podzáložiek + ⚙️, odznaky, prepínače, alarmy so stavom, rýchle akcie ===== */
.vnavw{display:flex;gap:8px;align-items:stretch;min-width:0}
.vnavw .vnav{flex:1 1 auto;min-width:0}
.vnav button{position:relative}
.vbdg{position:absolute;top:4px;right:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ef4444;color:#fff;font:800 .62rem/18px var(--f-ui,system-ui);font-style:normal;text-align:center;box-shadow:0 0 10px rgba(239,68,68,.55);pointer-events:none}
.vgear{all:unset;flex:none;position:relative;width:58px;min-height:62px;box-sizing:border-box;display:grid;place-items:center;font-size:1.35rem;cursor:pointer;border-radius:22px;border:1px solid var(--ds-edge,rgba(255,255,255,.18));background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.vgear[aria-pressed=true]{border-color:rgba(165,243,252,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 18px rgba(34,211,238,.3)}
.vgear .vbdg{top:2px;right:2px}
.fsw{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px;margin:10px 0 4px;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05)}
.fsw::-webkit-scrollbar{display:none}
.fsw button{all:unset;flex:none;cursor:pointer;min-height:42px;padding:0 14px;border-radius:14px;font:700 .8rem var(--f-ui,system-ui);color:var(--muted,#aab);white-space:nowrap;display:flex;align-items:center;box-sizing:border-box}
.fsw button[aria-pressed=true]{color:#fff;background:linear-gradient(135deg,rgba(34,211,238,.32),rgba(139,92,246,.30));box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.afl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.afl::-webkit-scrollbar{display:none}
.afl button{all:unset;flex:none;cursor:pointer;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);font:600 .76rem var(--f-ui,system-ui);white-space:nowrap;display:flex;gap:6px;align-items:center;box-sizing:border-box}
.afl button b{font-weight:800;opacity:.8}
.afl button[aria-pressed=true]{background:rgba(34,211,238,.22);border-color:rgba(165,243,252,.6);color:#fff}
.alst{display:grid;gap:8px}
.xai .xab{display:grid;gap:4px;min-width:0}
.xai .xat{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.xai .xat b{overflow-wrap:anywhere;min-width:0}
.xai .xad{overflow-wrap:anywhere}
.astp{flex:none;font:800 .6rem var(--f-ui,system-ui);font-style:normal;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#e5e7eb;white-space:nowrap}
.astp.n{background:rgba(239,68,68,.25);color:#fecaca}.astp.r{background:rgba(250,204,21,.22);color:#fde68a}.astp.v{background:rgba(52,211,153,.22);color:#a7f3d0}.astp.f{background:rgba(148,163,184,.25);color:#e2e8f0}
.aeur{flex:none;font:800 .7rem var(--f-num,system-ui);font-style:normal;color:#fca5a5;white-space:nowrap}
.asn{color:#c7d2fe!important}
.xai .achips,.xai .aact{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.achip{all:unset;cursor:pointer;min-height:32px;padding:0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);font:600 .72rem var(--f-ui,system-ui);display:inline-flex;align-items:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-sizing:border-box}
.aab{all:unset;cursor:pointer;min-height:40px;padding:0 11px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));font:700 .74rem var(--f-ui,system-ui);display:inline-flex;gap:5px;align-items:center;box-sizing:border-box;white-space:nowrap}
.aab.ok{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.14)}
.aab:disabled{opacity:.5}
.xai.ast-v,.xai.ast-f{opacity:.72}
.aflash{animation:aflash 1.1s ease-in-out 2}@keyframes aflash{50%{box-shadow:0 0 0 3px rgba(34,211,238,.7),0 0 30px rgba(34,211,238,.45)}}
.qbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.qbar button{all:unset;cursor:pointer;min-height:54px;padding:10px 12px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 26px rgba(2,6,23,.35);display:flex;gap:9px;align-items:center;box-sizing:border-box;min-width:0}
.qbar button span{flex:none;font-size:1.25rem}
.qbar button b{font:700 .8rem/1.2 var(--f-head,system-ui);overflow-wrap:anywhere;min-width:0}
.qbar button:first-child{border-color:rgba(248,113,113,.5);background:linear-gradient(160deg,rgba(248,113,113,.22),rgba(255,255,255,.04))}
@media (max-width:420px){.qbar{grid-template-columns:repeat(2,minmax(0,1fr))}.qbar button:first-child{grid-column:1/-1}}
.ds-kpis.k5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media (max-width:520px){.ds-kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}.ds-kpis.k5>.ds-kpi:last-child:nth-child(odd){grid-column:1/-1}}
.tdc{margin-top:12px}
.tdh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.tdh b{font:800 1rem var(--f-head,system-ui)}.tdh small{color:var(--muted,#aab);font-size:.74rem}
.todo{display:grid;gap:8px}
.tdi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px;border-radius:16px;border:1px solid rgba(255,255,255,.12);border-left:3px solid var(--warn,#facc15);background:rgba(255,255,255,.04)}
.tdi.r{border-left-color:var(--bad,#f87171);background:rgba(248,113,113,.07)}.tdi.b{border-left-color:var(--blue,#60a5fa)}
.tdn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);font:800 .8rem var(--f-num,system-ui)}
.tdi>div{display:grid;gap:2px;min-width:0}.tdi>div b{font-size:.86rem;overflow-wrap:anywhere}.tdi>div small{font-size:.74rem;color:var(--muted,#aab);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

const HELP={
home:{t:"Prehľad",i:"🏠",r:"Ranný prehľad firmy: čo je nové, čo čaká na teba, termíny, upozornenia a počasie.",s:[
 ["☀️ Ranná správa v 💬","Každý deň ráno svieti na 💬 (vpravo dole) bodka. Vnútri: včerajšie nákupy a marža, čo čaká, dnešné jazdy, spokojnosť ľudí, zákazy jázd SK/HU a počasie. Pod tým hotová ranná správa pre každého vodiča s dnešnou jazdou – pošleš ju sám ťuknutím na SMS alebo WhatsApp. Farmári dostávajú v 💬 svoju správu: našu cenu so zmenou oproti včerajšku, počasie ako semafor (zber, postrek), svoje autá a zmeny obchodov."],
 ["🔔 Zvonček v každej sekcii","Hore v každej záložke je 🔔 s počtom. Ukáže iba to, čo patrí do tejto sekcie: „Na vybavenie“ zmizne samo, keď vec vybavíš (prijmeš, odpovieš, zamietneš), a upozornenia z mobilu zmiznú po prečítaní alebo keď v sekcii už nič nečaká. Prečítané platí na všetkých tvojich zariadeniach. Po otvorení sekcie sa jej upozornenia zmažú aj z lišty v telefóne a rovnaké upozornenie už nepípa znova."],
 ["Dlaždice","Každá dlaždica ukazuje jednu vec (nové požiadavky, odvozy, alarmy, sklad…). Ťukni a prejdeš rovno do detailu."],
 ["Upozornenia","Hore sú veci, ktoré treba vybaviť dnes – napríklad nepodpísané zmluvy, chýbajúce váženia alebo nezapísaná práca."],
 ["Obnoviť","Údaje sa obnovujú samé. Tlačidlom ↻ ich načítaš hneď."]]},
calc:{t:"Kalkulačky",i:"🧮",r:"Kalkulačka sušenia a čistenia a kalkulačka nákupnej ceny ERNTE.",s:[
 ["Sušenie a čistenie","Zadaj komoditu, tony, vlhkosť, nečistoty a cenu. Uvidíš fakturačnú hmotnosť, sumu a ako ju mení vlhkosť – rovnako ako vo vyúčtovaní. Farmári majú tú istú kalkulačku."],
 ["Nákupná cena","Z ceny odberateľa, dopravy a burzy vypočíta, za koľko môže ERNTE kúpiť od farmára."]]},
qd:{t:"Uzatvoriť obchod",i:"🤝",r:"Nový obchod s farmárom za minútu – vyplníš, odfotíš alebo povieš.",s:[
 ["Odfotiť pečiatku","Odfoť pečiatku farmára – aplikácia prečíta názov, IČO, DIČ, adresu a telefón. Ak farmára už má, sama ho vyberie."],
 ["Odfotiť papier","Odfoť ručne písaný papier s obchodom – aplikácia vyplní farmára, komoditu, tony, cenu a termín."],
 ["Povedať","Ťukni 🎤 a povedz napr. „Novák, repka sto ton, štyristodvadsať eur, budúci týždeň“. Ťukni znova = hotovo."],
 ["Uzatvoriť","Skontroluj 4 kroky a ťukni Uzatvoriť. Zmluva sa hneď pošle farmárovi na podpis do aplikácie; cez WhatsApp/SMS jedným ťuknutím (aj s prihlásením, ak ho ešte nemá)."]]},
zuct:{t:"Zúčtovanie",i:"🧾",r:"Vyúčtovanie dodávok od farmárov podľa vážnych lístkov.",s:[
 ["Dashboard","Hore vyber obdobie (týždeň, mesiac, sezóna alebo dátumy), komoditu a odberateľa. Vidíš lístky, tony, hodnotu a dopravu. Tlačidlo 🚚 PDF doprava = hrubá váha × sadzba €/t (predvolene 9,40) s DPH 23 %. Tlačidlo 🧾 PDF odberateľ = podklad k faktúre s prenesením daňovej povinnosti."],
 ["Zúčtovanie odberateľa","Nahraj Excel od odberateľa (všetko je na ERNTE). Označ lístky – podľa komodity alebo ŠPZ – a prideľ ich farmárovi. Nového zákazníka pridáš tlačidlom ➕ Nový zákazník. Pridelené lístky sa hneď zarátajú do jeho zmlúv a zúčtovania."],
 ["Vážne lístky","Každý lístok: hrubá váha, nečistoty, vlhkosť. App odráta čistenie a sušenie a vypočíta fakturačnú hmotnosť a sumu."],
 ["Zmluvy","Pri každej zmluve vidíš, koľko je dodané, čo ostáva a či je splnená tolerancia."],
 ["Pravidlá","Normy vlhkosti a sadzby čistenia a sušenia nastavíš v Pravidlách – platia aj pre kalkulačku farmárov."]]},
agro:{t:"Agro služby",i:"🚜",r:"Práce strojmi ERNTE pre farmárov – objednávky, cenník a náklady strojov.",s:[
 ["Objednávky","Farmár si v aplikácii objedná prácu. Ty ju potvrdíš, naplánuješ a označíš hotovú."],
 ["Cenník","Ceny prác, ktoré vidia farmári (za ha alebo hodinu)."],
 ["Náklady","Iba majiteľ: náklady strojov a marža za prácu."]]},
evid:{t:"Evidencia",i:"📒",r:"Náklady, výnosy, výkony, dochádzka a výplaty podľa zákona – namiesto Excelu.",s:[
 ["Náklady","V časti <b>Náklady a výnosy</b> ťukni ➕, zadaj dátum, kategóriu (PHM, nakup, služby…), množstvo a cenu – suma sa vypočíta sama. Pridaj stroj a pole, aby bolo vidno, kde peniaze idú."],
 ["Dochádzka","Vedúci každý mesiac zapíše pri každom človeku odpracované dni, dovolenku, PN, dni na poli a hodiny v sobotu, nedeľu, v noci, vo sviatok a nadčasy. Peniaze nevidí."],
 ["Výplaty","Majiteľ v <b>Výplatách</b> pripraví mesiac, skontroluje výpočet (odvody, daň, bonus, stravné), schváli a po zaplatení označí <b>Vyplatené</b> – vtedy sa mesiac zmrazí. Výplatné pásky a rekapitulácia pre účtovníčku sa dajú vytlačiť."],
 ["Sklad","V <b>Sklade</b> ťukni 📸 a odfoť bloček – Claude prečíta položky, ty skontroluješ a jedným ťuknutím ich zapíšeš do nákladov aj na sklad. Súčiastku odfotíš a appka ju rozpozná. Pri vydaní zapíš, do ktorého stroja išla. V „Z nákupov“ rozhodneš o starších nákupoch."],
 ["Prístupy","Vedúcim zapneš v Tíme → ⚙️ Prístupy: „Evidencia“ (zápis nákladov) a „Dochádzka“. Výnosy, mzdy a výsledok vidí iba majiteľ."]]},
trus:{t:"Kurací trus",i:"🐔",r:"Vývozy kuracieho trusu z fariem Baromfi (HU) do BPS Kamenica nad Cirochou – od nahlásenia po faktúru.",s:[
 ["Ako to ide","<b>1.</b> Baromfi v aplikácii nahlási vývoz: farma, dátum, čas, počet áut. Príde ti upozornenie. <b>2.</b> VALKO dispečing zaškrtne autá (ŠPZ) a schváli. <b>3.</b> BPS hneď vidí, kedy a koľko ton príde, ktoré autá a koľko zaplatí, a doplní miesto vykládky pre vodiča. <b>4.</b> Baromfi zadá netto pri nakládke, BPS pri prevzatí."],
 ["Ceny","Výkup, predaj a doprava €/km sa nastavujú v Nastaveniach. Pri schválení sa ceny vývozu zmrazia. Doprava sa platí za jazdu (km otočka × €/km), trus podľa váženia: Baromfi podľa nakládky, BPS podľa vykládky."],
 ["Kto čo vidí","Baromfi: iba výkupnú cenu a svoje vývozy, ako odberateľa vidí ERNTE. BPS: iba svoju cenu, dopravu a dodávky, nie dodávateľa ani nákup. VALKO dispečing: autá, miesta a tony bez cien. Zisk a ekonomiku trás vidíš iba ty."],
 ["Fakturácia","V časti Fakturácia vyber obdobie a vytlač podklady: Baromfi → ERNTE (bez DPH, dodanie z HU), VALKO → ERNTE (doprava), ERNTE → BPS (trus + doprava s DPH)."]]},
req:{t:"Požiadavky",i:"📥",r:"Všetko, čo ti farmári pošlú z aplikácie – na jednom mieste.",s:[
 ["Odkiaľ prichádzajú","Farmár v aplikácii ťukne <b>Predať</b> pri komodite (chce predať tony za cenu z cenníka), <b>Objednať odvoz</b>, <b>Súhlasím</b> pri obchode alebo pošle <b>Správu</b>. Nová požiadavka ti hneď zasvieti s číslom na záložke."],
 ["Čo s ňou spravíš","Pri „Chcem predať“ ťukni <b>Založiť obchod</b> – údaje sa predvyplnia do záložky Obchody. Pri odvoze naplánuj auto v Doprave. Potom požiadavku označ <b>Vybavené</b> alebo <b>Zamietnuť</b> a môžeš farmárovi napísať odpoveď – uvidí ju v aplikácii."],
 ["Prepojenie","Požiadavka → Obchod → Doprava. ERNTE AI vidí nové požiadavky a pripomenie ti tie nevybavené."]]},
price:{t:"Cenník",i:"💶",r:"Výkupné ceny, ktoré vidia všetci prihlásení farmári.",s:[
 ["Ako zadávať","Ceny sú <b>€/t FCA farma bez DPH</b> (na farmárovom dvore). Prázdne pole = farmár komoditu nevidí. Vyplň <b>Platí do</b> – farmár vidí, dokedy cena platí."],
 ["Uložiť a zverejniť","Po uložení ich farmári vidia <b>okamžite</b> a môžu ťuknúť Predať. Keď sa blíži koniec platnosti (7 dní), hore ťa upozorní žltý pás, po vypršaní červený."],
 ["🤖 Automatický cenník","Ceny sa vypĺňajú samy podľa odberateľov <b>Agro-Somotor a Bunge</b> z regionálnych cien DAP Somotor, DAP Bunge Tállya a DAP Bunge Martfű (za koľko farmári z regiónu vozia na sklad) mínus doprava a odpočet ERNTE a hneď sa zverejnia. Burza iba vtedy, keď regionálna cena chýba. Kontroluje sa každých 20 minút, keď je aplikácia otvorená. Zmenu nad 10 % najprv potvrdíš."],
 ["✍️ Moje ceny","Keď máš vlastné ceny, prepíš ich v tabuľke a ulož – zverejnia sa hneď a platia do zvoleného dátumu (predvolene 7 dní), potom sa cena vráti na automatickú. Raz za čas ťa aplikácia pripomenie, aby si ich zapísal."],
 ["💶 Upozornenie","Pri každej zmene zverejnenej ceny (automatika, ty alebo tím) ti hore vyskočí pás s cenou pred a po."],
 ["🔔 Zvonenie pri zmene ceny","Každá zmena (aj zrušená cena, nová plodina, zmena platnosti) príde hneď do telefónu – aj v noci: stará → nová cena, rozdiel v € a %, kto a kedy, platnosť. Viac zmien naraz = jedna správa. <b>Veľká zmena</b> (nad 5 % alebo 15 €/t, nastavíš dole) má ⚠️ a porovnanie s burzou – ťukni na ňu, inak sa o 10 min zopakuje (najviac 3×). Tvoja vlastná zmena príde ticho. Ťuknutie otvorí Cenník. Farmárom sa nič neposiela."],
 ["📜 História cien","Dole v Cenníku: posledných 50 zmien – kto, kedy, stará a nová cena a rozdiel, s filtrom podľa plodiny."],
 ["Prepojenie","ERNTE AI porovnáva tvoj cenník s burzou (MATIF, CBOT) a upozorní, keď je cena nad burzou alebo máš veľkú rezervu. Farmár nikdy nevidí burzu ani odberateľa."]]},
trans:{t:"Doprava",i:"🚚",r:"Plánovanie odvozov od farmárov autami VALKO.",s:[
 ["Naplánovať jazdu","Vyber farmára (a obchod), deň, čas, auto a vodiča. Farmár vidí v aplikácii, kedy príde auto, ŠPZ a vodiča."],
 ["Stavy jazdy","Naplánovaná → auto na ceste → na nakládke → naložené → vyložené/zvážené. Farmár vidí polohu auta na mape <b>len do naloženia</b> – kam to vezieš, nevidí nikdy."],
 ["Prepojenie","Vyložené tony sa <b>samy pripočítajú</b> k obchodu (dodané t). Polohu áut berie z Commandera."]]},
fleet:{t:"Flotila",i:"🚛",r:"Všetko o autách VALKO z Commandera – živo, každé 2 minúty.",s:[
 ["Dashboard","Prehľad: zisk/strata, alarmy, spotreba, autá na ceste, mzdy, posledný pohyb. Tlačidlá ťa presunú do sekcie."],
 ["Obdobie","Hore vyber Dnes / 7 dní / 30 dní / <b>Tento mesiac</b>. Zisk sa dá spočítať len za mesiac (mzdy sú mesačné)."],
 ["Upozornenia","Na telefón (ntfy) chodia: príchod na dvor Medovská, Agro-Somotor, čerpačky Slovnaft, odchod po státí, podozrivý pokles nafty."],
 ["Kto vidí čo","Zisk, mzdy a pevné náklady vidíš len ty. Dispečer vidí autá, jazdy a alarmy."]]},
deals:{t:"Obchody",i:"🤝",r:"Tvoje nákupy od farmárov – kto, čo, koľko, za koľko a dokedy.",s:[
 ["Kedy založiť","Keď sa s farmárom dohodneš (po telefóne, osobne) alebo z jeho požiadavky „Chcem predať“. Vyplň farmára, komoditu, tony, cenu €/t FCA a termín plnenia."],
 ["Stavy","<b>Návrh</b> (farmár vidí „čaká na podpis“ a ťukne Súhlasím) → <b>Podpísaný</b> → <b>Odvoz beží</b> → <b>Odvezený</b> → <b>Fakturácia</b> → <b>Zaplatený</b> (alebo Zrušený)."],
 ["Prepojenie","Odvozy v Doprave sa k obchodu pripočítavajú samy. Farmár vidí svoje obchody v aplikácii – bez odberateľa a burzy. ERNTE AI z obchodov počíta maržu oproti burze a upozorní na riziká."]]},
farm:{t:"Farmári",i:"👨‍🌾",r:"Zoznam dodávateľov a ich prístup do aplikácie.",s:[
 ["Údaje","Meno, IČO, DIČ, IBAN, kontakt. Neaktívny farmár sa nevie prihlásiť."],
 ["Prístup","Ťukni <b>Vytvoriť heslo</b> – farmár sa prihlási e-mailom alebo telefónnym číslom a heslom. Heslo sa zobrazí <b>iba raz</b>, pošli mu ho (SMS/WhatsApp). Nikde sa neukladá."],
 ["Čo farmár vidí","Cenník, svoje obchody, odvozy (auto do naloženia), počasie a radar. Nikdy nevidí odberateľov, burzu, miesto vykládky ani iných farmárov."],
 ["⚙️ Podmienky","Pri každom farmárovi ťukni <b>⚙️ Podmienky</b>: bonus €/t na všetko alebo na komoditu (s platnosťou od–do), splatnosť, doprava, záloha, kvalita a poznámka. Farmár vidí iba svoj bonus („vaša cena“) a svoje podmienky – internú poznámku nie. Pri predaji z aplikácie sa bonus započíta sám."]]},
cal:{t:"Kalendár",i:"📅",r:"Tvoje pripomienky a stretnutia – vidíš ich iba ty.",s:[
 ["Pripomienka","＋ Pripomienka: čo, dátum, čas, trvanie, kedy upozorniť (v čase, 15 min, 1 h, 1 deň, týždeň vopred) a opakovanie. Upozornenie príde do mobilu ako ostatné upozornenia aplikácie."],
 ["🎤 Povedať / 🎙️ Hlasovka","🎤 Povedať: nadiktuj napr. „v pondelok ráno o ôsmej stretnutie v APD Malčice, poriešiť reklamáciu sóje“ – vyplní sa čo, dátum, čas aj miesto (ak telefón reč nerozpozná, diktuj cez mikrofón na klávesnici do Poznámky). 🎙️ Nahrať hlasovku: otvorí záznamník v telefóne, nahrávka sa uloží k pripomienke a pri upozornení ju vypočuješ v Kalendári."],
 ["🗑 Skryť upozornenie","V Prehľade, v Posledných upozorneniach a v Aktivite tímu potiahni dlaždicu doľava alebo ťukni ✕. Keď príde nová informácia, vráti sa sama. ↺ Zobraziť skryté ich vráti hneď."],
 ["⛔ Som obsadený","Druh „som obsadený“ zablokuje čas – nikto si ho ako stretnutie nevyberie. Celý deň zablokuje celý deň."],
 ["Žiadosti o stretnutie","Každý zamestnanec a farmár má tlačidlo 📅 Stretnutie. Ponúknu sa mu iba tvoje voľné časy, najprv ⭐ preferované (8:00–13:00). Žiadosť ti príde do mobilu: ✅ potvrdíš, 🔁 presunieš na iný voľný čas alebo ❌ zamietneš. On stav uvidí v 📅 Stretnutie."],
 ["Nastavenie","⚙️ Kedy si ťa môžu objednať: preferované hodiny, od–do, dni, najskôr o koľko hodín, koľko dní dopredu. Sviatky SR sa vynechajú."]]},
test:{t:"Test",i:"🧪",r:"Iba pre teba – pozri aplikáciu očami iných.",s:[
 ["Test pohľady","Farmár, obchodník (Galajda) a dopravca (Tóth) – testovacie účty v novom okne."],
 ["👁 Prepínač","Vyber zamestnanca alebo farmára – v novom okne uvidíš aplikáciu presne tak, ako ju má on (záložky, prístupy, údaje). Iba na pozeranie: uloženie a odosielanie je zablokované. Náhľad zavrieš modrým pásom hore. Každé otvorenie sa zapíše."]]},
wx:{t:"Počasie",i:"🌦️",r:"Počasie a radar zrážok pre Michalovce a okolie.",s:[
 ["Čo ukazuje","Teraz, každú hodinu a 7 dní dopredu; radar zrážok s animáciou posledných 2 hodín."],
 ["Na čo","Plánovanie žatvy, odvozov a nakládky – to isté vidia aj farmári."]]},
pred:{t:"Algomancia · AI veštenie obchodu",i:"🔮",r:"Digitálna veštba: kde kúpiť, kam predať a kedy – čísla, burza, vesmír a AI. Iba pre majiteľa, zamknuté PIN-om.",s:[
 ["🤖 AI veštba","Tlačidlo hore: AI (Claude) prečíta všetky čísla (ponuky, cenník, burza, odberatelia, doprava) aj dnešnú oblohu a karty a vynesie veštbu na každú komoditu: kúpiť / držať / predať, za koľko a kedy. Veštba je zložená z čísel – vesmír ju iba dofarbí."],
 ["PIN","Pri prvom otvorení si nastavíš PIN (4–8 číslic). Po 15 minútach nečinnosti alebo pri prechode na inú záložku sa sekcia zamkne. Po 5 zlých pokusoch treba počkať 5 minút. Zabudnutý PIN zrušíš heslom k účtu."],
 ["Správa na dnes","Hore sú najlepšie kombinácie nákup → predaj: od koho kúpiť, komu predať, doprava podľa vzdialenosti a marža €/t aj spolu."],
 ["Zdroje a odberatelia","Nákup: ponuky farmárov (s GPS), tvoj výkupný cenník, trhy pri hranici (Čop, Záhony, Batyovo). Predaj: ponuky odberateľov, ktoré zapíšeš, a zmluvy s odberateľmi. Burza mínus báza je iba orientačne."],
 ["Kedy predať","Termíny burzy (napr. nov → feb) mínus náklad skladovania ukážu, či sa oplatí držať alebo predávať priebežne. Každý deň sa uloží záznam burzy pre trend 7 a 30 dní."],
 ["Prehodnotenie","Odporúčania sa ukladajú a po týždni sa porovnajú s burzou – vidíš, či sedeli."],
 ["Vesmír","Pri každej komodite sa ťahá tarot, Lenormand a cigánske karty (na deň pevne), počíta sa fáza Mesiaca, spätné planéty a tranzity k tvojmu horoskopu. Váhu vesmíru (predvolene 20 %) nastavíš posuvníkom. Vidíš vedľa seba odporúčanie len z čísel a s vesmírom."],
 ["Funguje vesmír?","Každá zložka (čísla, karty, Mesiac, tranzity, kombinácia) sa po 7 a 30 dňoch porovná s burzou. Podľa úspešnosti si môžeš váhu zvýšiť alebo znížiť."]]},
team:{t:"Tím",i:"👥",r:"Kto z ERNTE/VALKO má prístup a čo smie.",s:[
 ["Roly","<b>Majiteľ</b> – všetko vrátane zisku a miezd. <b>Admin</b> – obchody, cenník, farmári. <b>Dispečer</b> – požiadavky, doprava, flotila, počasie. <b>Fakturácia</b> – všetko okrem flotily."],

function tankChart(R){if(R.length<2)return `<div class="s">Zatiaľ málo meraní – graf sa naplní počas dňa.</div>`;const W=340,H=150,B=22,t0=new Date(R[0].at)-0,t1=new Date(R[R.length-1].at)-0,mx=Math.max(...R.map(r=>+r.tank)),mn=Math.min(...R.map(r=>+r.tank)),rg=Math.max(20,mx-mn);

  const mv=R.filter(r=>(+r.speed||0)>5).map(r=>`<rect x="${X(r.at).toFixed(1)}" y="${H-B-2}" width="2" height="4" fill="#b6ff3b"/>`).join("");
  const ticks=[0,.25,.5,.75,1].map(k=>{const t=t0+(t1-t0)*k,d=new Date(t);return `<text x="${(k*W).toFixed(0)}" y="${H-6}" fill="#9aa3b8" font-size="9" text-anchor="${k===0?"start":k===1?"end":"middle"}">${d.toLocaleDateString("sk-SK",{day:"numeric",month:"numeric"})} ${d.toLocaleTimeString("sk-SK",{hour:"2-digit",minute:"2-digit"})}</text>`}).join("");
  const svg=`<svg viewBox="0 0 ${W} ${H}" class="tchart" role="img" aria-label="Hladina nafty za 48 h"><defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>

    <text x="4" y="12" fill="#9aa3b8" font-size="10">${Math.round(mx)} l</text><text x="4" y="${H-B-8}" fill="#9aa3b8" font-size="10">${Math.round(mn)} l</text></svg>`;
  const list=D.length?`<div class="tdrops">${D.map(([a,b,dt])=>`<div class="al r"><b>🚨 Pokles ${n0(+a.tank-+b.tank)} l v stojacom aute</b><br>${f(a.at)} (${n0(+a.tank)} l) → ${f(b.at)} (${n0(+b.tank)} l)${dt>3600e3?` · <b>počas výpadku signálu ${n1(dt/3600e3)} h</b> – presný čas je v tomto okne`:""}${R.slice(R.indexOf(a),R.indexOf(b)+1).some(r=>+r.ign===1)?" · motor bežal":" · motor vypnutý"}</div>`).join("")}</div>`:`<div class="s">Žiadny pokles v stojacom aute za 48 h.</div>`;

// cena zmluvy nad zverejneným cenníkom → návrh sa podpíše až po schválení majiteľom (databáza deal_price_guard)
function dealOver(d){if(!["navrh","podpisany"].includes(d.status)||d.archived)return "";const p=(STATE.prices||[]).find(x=>x.com===d.com);if(!p||p.price==null)return "";

  const t=`Cena zmluvy ${fmt(d.price)} €/t je nad cenníkom (${fmt(c)} €/t) o <b>+${fmt(dif)} €/t</b> · spolu +${fmt(dif*(+d.tons||0))} €`;
  if(ok)return `<div class="box"><div>✅ ${t}<br><small>Schválené majiteľom${d.price_ok_by?" ("+esc(d.price_ok_by)+")":""}.</small></div></div>`;
  if(d.status!=="navrh")return ROLE==="owner"?`<div class="box w"><div>⚠️ ${t}</div></div>`:"";
  return ROLE==="owner"?`<div class="box w"><div>⚠️ ${t}. Podpis zmluvy čaká na tvoje schválenie.</div></div><div class="btns"><button type="button" class="lime" data-dpok="${esc(d.id)}">✓ Schváliť cenu nad cenníkom</button></div>`
