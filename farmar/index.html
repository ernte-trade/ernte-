<style>
/* ERNTE – sklo, žiara, profesionálna typografia. Tmavá nočná scéna s farebnou žiarou, sklenené karty, Unbounded nadpisy + Sora text + Plex Mono čísla. */
:root{
  --bg:#05070a; --ink:#f2f5ff; --muted:#9aa3b8; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --glass:rgba(22,27,38,.55); --glass2:rgba(255,255,255,.05); --field:rgba(255,255,255,.06);
  --lime:#b6ff3b; --mint:#5eead4; --violet:#7c5cff; --cyan:#22d3ee; --green:#0d2a17;
  --grad:linear-gradient(135deg,#b6ff3b,#5eead4); --grad2:linear-gradient(135deg,#7c5cff,#22d3ee);
  --warn:#ffcf5a; --bad:#ff6b81; --blue:#7cc4ff;
  --f-head:"Unbounded","Sora",system-ui,sans-serif; --f-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:400 15px/1.5 var(--f-ui);-webkit-text-size-adjust:100%;min-height:100vh;
  background:radial-gradient(60% 40% at 90% -5%,rgba(124,92,255,.38),transparent 70%),radial-gradient(55% 40% at -10% 30%,rgba(34,211,238,.22),transparent 70%),radial-gradient(50% 35% at 70% 105%,rgba(182,255,59,.18),transparent 70%),var(--bg);
  background-attachment:fixed;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:14px}
header.top{display:flex;align-items:center;gap:12px;padding:16px 0 6px}
header.top img{height:44px;width:auto;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 8px 30px rgba(182,255,59,.18)}
header.top .tt{flex:1;min-width:0}
header.top h1{margin:0;font:600 1.12rem/1.15 var(--f-head);letter-spacing:-.02em}
header.top small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.out{min-height:38px;padding:0 14px;font-size:.78rem}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px;display:grid;gap:6px;color:#fff;
  background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(34,211,238,.18) 55%,rgba(182,255,59,.20));border:1px solid var(--line2);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 24px 60px rgba(0,0,0,.45)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(182,255,59,.45),transparent 70%);filter:blur(10px);pointer-events:none}
.hero small{color:rgba(255,255,255,.75);font-size:.8rem;position:relative}
.hero b{font:600 1.45rem/1.15 var(--f-head);letter-spacing:-.02em;position:relative;overflow-wrap:anywhere}
h2{margin:12px 4px 0;font:600 .7rem var(--f-head);letter-spacing:.16em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:grid;gap:10px;min-width:0;
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 44px rgba(0,0,0,.35)}
.card .t{font:600 1rem var(--f-head);letter-spacing:-.01em}.s{font-size:.82rem;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.88rem}
.num,.row b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font:600 .7rem var(--f-num);background:rgba(182,255,59,.14);color:var(--lime);border:1px solid rgba(182,255,59,.35);white-space:nowrap}
.pill.w{background:rgba(255,207,90,.12);color:var(--warn);border-color:rgba(255,207,90,.35)}.pill.b{background:rgba(124,196,255,.12);color:var(--blue);border-color:rgba(124,196,255,.35)}
.pill.g{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--line)}.pill.r{background:rgba(255,107,129,.12);color:var(--bad);border-color:rgba(255,107,129,.35)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:600 .9rem var(--f-ui);min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .12s,box-shadow .2s}
button:active,.btn:active{transform:scale(.98)}

button.lime,.btn.lime{background:var(--grad);border-color:transparent;color:#06110a;box-shadow:0 8px 26px rgba(182,255,59,.30)}

select option{background:#111621;color:var(--ink)}

.tabs .cnt{background:var(--bad);color:#fff;border-radius:999px;font:600 .7rem var(--f-num);padding:1px 7px;box-shadow:0 0 12px rgba(255,107,129,.7)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:2px}
.prow .t{font:600 1rem var(--f-head);letter-spacing:-.01em}.prow .num{font-size:1.08rem;white-space:nowrap;color:#fff;text-shadow:0 0 18px rgba(182,255,59,.35)}
.prow .sell{min-height:44px}
.prow form{grid-column:1/-1}
.box{background:linear-gradient(135deg,rgba(182,255,59,.10),rgba(94,234,212,.06));border:1px solid rgba(182,255,59,.28);border-radius:20px;padding:14px 16px;font-size:.88rem;display:grid;gap:8px}
.box b{color:#fff}
.box.w{background:rgba(255,207,90,.08);border-color:rgba(255,207,90,.3);color:var(--warn)}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:9px 11px}.kpi small{display:block;font-size:.68rem;color:var(--muted);letter-spacing:.04em}.kpi b{font:600 1rem var(--f-num)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;transition:.25s;
  background:rgba(18,22,32,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(182,255,59,.4);color:#fff;padding:13px 18px;border-radius:16px;font-weight:600;font-size:.9rem;max-width:min(92vw,520px);z-index:50;pointer-events:none;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 24px rgba(182,255,59,.18)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.center{min-height:60vh;display:grid;align-content:center;gap:16px}
.copy{border:0;background:none;padding:0;min-height:0;color:var(--lime);font:600 .9rem var(--f-num);text-decoration:none;display:inline}

.bar{position:relative;flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.08)}.bar i{position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#b6ff3b,#ffb020);box-shadow:0 0 10px rgba(182,255,59,.4)}

async function enter(user){ME=user;$("outBtn").hidden=false;
  const st=await sb.from("staff").select("email,name,role").eq("email",String(user.email).toLowerCase()).maybeSingle();
  if(st.data){ROLE=st.data.role;ME.staffName=st.data.name;$("hS").textContent=st.data.name+" · ERNTE";startStaff();return}
  const fr=await sb.from("farmers").select("*").limit(1).maybeSingle();
  if(fr.data){FARMER=fr.data;$("hS").textContent=fr.data.name;startFarmer();return}
  $("app").innerHTML=`<div class="card"><div class="t">Váš e-mail ešte nemá prístup</div><div class="s">${esc(user.email)} zatiaľ nie je v zozname dodávateľov ERNTE. Zavolajte nám a zapíšeme vás.</div><div class="btns"><a class="btn pri" href="tel:+421918449991">Zavolať ERNTE</a></div></div>`}

function baseLayers(map,sat){const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,className:"ldark",attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});

    L.DomEvent.disableClickPropagation(d);const[b1,b2]=d.children;b1.onclick=()=>{map.removeLayer(esri);osm.addTo(map);b1.className="on";b2.className=""};b2.onclick=()=>{map.removeLayer(osm);esri.addTo(map);b2.className="on";b1.className=""};return d}});new C({position:"topright"}).addTo(map)}

const RADAR={frames:null,host:"",at:0,timer:null,map:null};
async function radarFrames(){if(RADAR.frames&&Date.now()-RADAR.at<5*60e3)return RADAR.frames;const r=await fetch("https://api.rainviewer.com/public/weather-maps.json",{cache:"no-store"});const j=await r.json();RADAR.host=j.host;RADAR.frames=[...(j.radar.past||[]),...(j.radar.nowcast||[])];RADAR.at=Date.now();return RADAR.frames}
function mountRadar(el){if(!el)return;clearInterval(RADAR.timer);
  el.innerHTML=`<div class="lmap ok rdm" style="height:340px;position:relative"></div><div class="rdbar"><button type="button" class="rdplay" aria-label="Prehrať / zastaviť">❚❚</button><span class="rdtime">načítavam radar…</span></div><div class="rdleg"><span>slabý</span><i></i><span>silný dážď / búrka</span></div><div class="rdsrc">Radar: RainViewer · posúvaj a približuj prstami</div>`;

  }).catch(()=>{tm.textContent="Radar sa nepodarilo načítať"})}

async function loadWx(force){if(!force&&WXD&&Date.now()-WXAT<15*60e3)return;
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${WXLOC.lat}&longitude=${WXLOC.lon}&hourly=temperature_2m,precipitation,precipitation_probability,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=Europe%2FBratislava&forecast_days=7`;
  try{const r=await fetch(u);WXD=await r.json();WXAT=Date.now()}catch(e){WXD={err:1}}}
function wxCard(){if(!WXD)return `<div class="card"><div class="s">Načítavam počasie…</div></div>`;if(WXD.err||!WXD.daily)return `<div class="card"><div class="s">Počasie sa nepodarilo načítať.</div></div>`;
  const H=WXD.hourly,D=WXD.daily,now=Date.now();let i0=H.time.findIndex(t=>new Date(t).getTime()>now-3600e3);if(i0<0)i0=0;
  const hrs=H.time.slice(i0,i0+24).map((t,k)=>{const i=i0+k,w=WMO(H.weather_code[i]);return `<div class="wxh"><small>${new Date(t).getHours()}:00</small><span>${w[0]}</span><b>${Math.round(H.temperature_2m[i])}°</b><em>${H.precipitation[i]>0?H.precipitation[i].toFixed(1)+" mm":(H.precipitation_probability[i]??0)+" %"}</em></div>`}).join("");
  const tmin=Math.min(...D.temperature_2m_min),tmax=Math.max(...D.temperature_2m_max),rng=Math.max(1,tmax-tmin);
  const days=D.time.map((t,i)=>{const w=WMO(D.weather_code[i]),d=new Date(t+"T12:00");const nm=i===0?"Dnes":i===1?"Zajtra":d.toLocaleDateString("sk-SK",{weekday:"short",day:"numeric",month:"numeric"});
    const a=(D.temperature_2m_min[i]-tmin)/rng*100,b=(D.temperature_2m_max[i]-tmin)/rng*100;
    return `<div class="wxd"><span class="dn">${esc(nm)}</span><span class="di" title="${w[1]}">${w[0]}</span><span class="dr">${D.precipitation_sum[i]>0?D.precipitation_sum[i].toFixed(1)+" mm":"–"} · ${D.precipitation_probability_max[i]??0} %</span><span class="dt"><b class="lo">${Math.round(D.temperature_2m_min[i])}°</b><i class="bar"><i style="left:${a}%;right:${100-b}%"></i></i><b>${Math.round(D.temperature_2m_max[i])}°</b></span></div>`}).join("");

function agg(R){const a={km:0,l:0,lkm:0,sec:0,n:0,max:0,ref:0,refe:0,priv:0,over:0};

function fleetAlerts(F){const out=[],now=Date.now(),avg=agg(F.rides).cons;
  for(const v of F.veh){const nm=v.plate||v.name||v.id;

    if(avg&&a.cons&&a.lkm>100&&a.cons>avg*1.2)out.push(["r",`${nm}: vysoká spotreba ${n1(a.cons)} l/100 km (priemer flotily ${n1(avg)})`]);

async function loadTank(id){const r=await sb.from("tank_log").select("at,tank,speed,ign").eq("vehicle_id",id).gte("at",new Date(Date.now()-48*3600e3).toISOString()).order("at",{ascending:true}).limit(3000);STATE.tank={id,rows:r.data||[],err:r.error}}
function tankChart(R){if(R.length<2)return `<div class="s">Zatiaľ málo meraní – graf sa naplní počas dňa.</div>`;const W=340,H=130,t0=new Date(R[0].at)-0,t1=new Date(R[R.length-1].at)-0,mx=Math.max(...R.map(r=>+r.tank)),mn=Math.min(...R.map(r=>+r.tank)),rg=Math.max(20,mx-mn);
  const X=t=>(new Date(t)-t0)/(t1-t0||1)*W,Y=v=>H-8-(v-mn)/rg*(H-20);
  const pts=R.map(r=>`${X(r.at).toFixed(1)},${Y(+r.tank).toFixed(1)}`).join(" ");
  const mv=R.filter(r=>(+r.speed||0)>5).map(r=>`<rect x="${X(r.at).toFixed(1)}" y="${H-4}" width="2" height="4" fill="#b6ff3b"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="tchart" role="img" aria-label="Hladina nafty za 48 h"><defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${H} ${pts} ${W},${H}" fill="url(#tg)"/><polyline points="${pts}" fill="none" stroke="#22d3ee" stroke-width="2"/>${mv}
    <text x="4" y="12" fill="#9aa3b8" font-size="10">${Math.round(mx)} l</text><text x="4" y="${H-10}" fill="#9aa3b8" font-size="10">${Math.round(mn)} l</text></svg><div class="s">Hladina nafty za 48 h · zelené čiarky dole = auto išlo. Prudký pád bez jazdy = podozrivé.</div>`}
function vFuel(F){const FC=Object.assign({drop:20,win:90,gap:30,cool:180},F.cfg.fuel||{});const E=F.ev.filter(e=>e.kind==="fuel_drop"||e.kind==="refuel_gap");
  const avg=agg(F.rides).cons;const hi=F.veh.map(v=>({v,a:agg(F.rides.filter(r=>r.vehicle_id===v.id))})).filter(x=>avg&&x.a.cons&&x.a.lkm>200&&x.a.cons>avg*1.15);
  let h=`<h2>Ochrana nafty</h2><div class="card fuelc">
   <div class="fuelhd"><span class="fic">🛡️</span><div><b>${E.length?E.length+" podozrivých udalostí":"Bez podozrivých udalostí"}</b><small>kontrola každé 2 min · upozornenie do ntfy s najvyššou prioritou</small></div></div>`;
  h+=E.length?E.slice(0,12).map(e=>`<div class="al ${e.kind==="fuel_drop"?"r":"w"}"><b>${e.kind==="fuel_drop"?"Pokles v stojacom aute":"Tankovanie nesedí"}</b> · ${esc(e.plate||"")} · <b>${n0(e.liters)} l</b>${e.place?" · "+esc(e.place):""}${e.driver?" · "+esc(e.driver):""} · ${new Date(e.at).toLocaleString("sk-SK",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"})}${e.lat?` · <a class="copy" style="font-size:.78rem" href="https://maps.google.com/?q=${e.lat},${e.lon}" target="_blank" rel="noopener">mapa</a>`:""}</div>`).join(""):"";
  if(hi.length)h+=hi.map(x=>`<div class="al b">Spotreba ${esc(x.v.plate||x.v.name)} je ${n1(x.a.cons)} l/100 km – o ${Math.round((x.a.cons/avg-1)*100)} % nad priemerom flotily. Pri dlhodobom rozdiele skontrolovať (odčerpávanie počas jazdy, tankovanie do iného vozidla).</div>`).join("");
  h+=`<div class="sub"><b>Čo stráži</b>
   <div class="fl"><i>1</i><span><b>Pokles nafty v stojacom aute</b> – ak hladina klesne o ${FC.drop}+ l do ${FC.win} min a auto sa nepohlo (aj pri vypnutom motore). Najčastejšia krádež: odčerpanie na parkovisku cez noc.</span></div>
   <div class="fl"><i>2</i><span><b>Tankovanie nesedí s nádržou</b> – natankované litre (z karty) vs. nárast v nádrži. Rozdiel ${FC.gap}+ l = tankovanie do kanistra/iného auta alebo podvod na stanici.</span></div>
   <div class="fl"><i>3</i><span><b>Nadmerná spotreba</b> – auto o 15 %+ nad priemerom flotily za obdobie.</span></div></div>
   <div class="sub"><b>Graf nádrže</b><label>Vozidlo<select id="fuelVeh"><option value="">– vyber auto –</option>${F.veh.filter(v=>v.tank).map(v=>`<option value="${esc(v.id)}"${FUELV===v.id?" selected":""}>${esc(v.plate||v.name)} · ${n0(v.tank)} l</option>`).join("")}</select></label>
   ${FUELV?(STATE.tank&&STATE.tank.id===FUELV?(STATE.tank.err?`<div class="s">Graf nie je zapnutý – spusti <a class="copy" href="nafta.html">nafta.html</a>.</div>`:tankChart(STATE.tank.rows)):"<div class='s'>Načítavam…</div>"):""}</div>
   <details><summary class="s" style="cursor:pointer">Citlivosť</summary><form class="f sub" id="fFuel"><label>Pokles o (l)<input name="drop" inputmode="numeric" value="${FC.drop}"></label><label>Za (min)<input name="win" inputmode="numeric" value="${FC.win}"></label><label>Rozdiel pri tankovaní (l)<input name="gap" inputmode="numeric" value="${FC.gap}"></label><label>Opakovať najskôr po (min)<input name="cool" inputmode="numeric" value="${FC.cool}"></label><div class="w btns"><button class="pri" type="submit">Uložiť</button></div></form>
   <div class="s">Údaj o nádrži je z CAN zbernice auta – presnosť asi ±2–5 %, na svahu kolíše. Preto sa porovnáva viac meraní a nižšie hodnoty ako 20 l neodporúčam.</div></details></div>`;
  return h}
document.addEventListener("submit",async e=>{const f=e.target;if(f.id!=="fPhones")return;e.preventDefault();const F=STATE.fleet;if(!F)return;
  const nm=n=>String(n||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z ]/g," ").split(/\s+/).filter(Boolean).sort().join(" ");
  const drivers=[...new Set(F.rides.map(r=>r.driver).filter(Boolean).concat(((STATE.pay||{}).rides||[]).map(r=>r.driver).filter(Boolean)))];
  const cur=Object.assign({},F.cfg.phones||{});let ok=0,miss=[];
  for(const line of String(new FormData(f).get("list")||"").split(/\r?\n/)){const m=line.match(/(\+?\d[\d \/-]{7,}\d)/);if(!m)continue;const name=line.replace(m[0],"").replace(/[\t;,|]+/g," ").trim();if(!name)continue;
    const d=drivers.find(x=>nm(x)===nm(name))||drivers.find(x=>nm(x).split(" ").some(w=>w.length>3&&nm(name).split(" ").includes(w)));if(d){cur[d]=m[0].trim();ok++}else miss.push(name)}
  const r=await sb.from("fleet_cfg").upsert({key:"phones",value:cur});if(r.error){toast("Chyba: "+r.error.message);return}STATE.fleet=null;renderStaff();toast(`Uložených ${ok} čísel${miss.length?" · nespárované: "+miss.join(", "):""}`,8000)},true);
document.addEventListener("submit",async e=>{const f=e.target;if(!f.dataset.phform)return;e.preventDefault();const ph=String(new FormData(f).get("ph")||"").trim();const cur=Object.assign({},(STATE.fleet&&STATE.fleet.cfg.phones)||{});if(ph)cur[f.dataset.phform]=ph;else delete cur[f.dataset.phform];
  const r=await sb.from("fleet_cfg").upsert({key:"phones",value:cur});if(r.error){toast("Chyba: "+r.error.message);return}STATE.phEdit=null;STATE.fleet=null;renderStaff();toast("Uložené.")},true);

  if(r.error){toast("Chyba: "+r.error.message);return}STATE.fleet=null;renderStaff();toast("Dvor uložený. Upozornenia sú zapnuté.",5000)}

async function teamLogin(login,name,role){const pw=genPw();const r=await sb.rpc("set_staff_login",{login_in:login,name_in:name,role_in:role,pw});if(r.error){toast("Nepodarilo sa: "+r.error.message,7000);return}

function vPrice(){const P=STATE.prices,valid=((STATE.settings||{}).pricelist||{}).valid||"";
  return `<form class="card f" id="fPrice"><div class="w s">Výkupné ceny FCA farma bez DPH. Prázdne = farmár komoditu nevidí. Po uložení ich hneď vidia všetci prihlásení farmári.</div>
  ${MK.map(m=>{const p=P.find(x=>x.com===m[0]);return `<label>${esc(m[1])} €/t<input name="p_${m[0]}" inputmode="decimal" value="${p&&p.price!=null?String(p.price).replace(".",","):""}" placeholder="–"></label>`}).join("")}
  <label class="w">Platí do<input name="valid" type="date" value="${esc(valid)}"></label><div class="w btns"><button class="pri" type="submit">Uložiť a zverejniť</button></div></form>`}
function vDeals(){const F=STATE.farmers.filter(f=>f.active),pre=DEALF||{};
  let h=`<form class="card f" id="fDeal"><div class="w t">Nový obchod</div>
   <label class="w">Farmár<select name="farmer" required><option value="">– vyber –</option>${F.map(f=>`<option value="${esc(f.id)}"${pre.farmer_id===f.id?" selected":""}>${esc(f.name)}</option>`).join("")}</select></label>
   <label>Komodita<select name="com" id="dCom">${MK.map(m=>`<option value="${m[0]}"${pre.com===m[0]?" selected":""}>${esc(m[1])}</option>`).join("")}</select></label>
   <label>Množstvo t<input name="tons" inputmode="decimal" required value="${esc(pre.tons??"")}"></label>
   <label>Cena €/t FCA<input name="price" id="dPrice" inputmode="decimal" required value="${esc(pre.price!=null?String(pre.price).replace(".",","):"")}"></label>
   <label>Termín plnenia<input name="term" value="${esc(pre.term||"")}" placeholder="napr. 30. 11. 2026"></label>
   <label class="w">Poznámka<input name="note" value="${esc(pre.note||"")}"></label>
   <div class="w btns"><button class="pri" type="submit">Uložiť obchod</button>${DEALF?`<button type="button" data-clrdeal>Zrušiť</button>`:""}</div></form>`;
  h+=STATE.deals.map(d=>`<div class="card"><div class="row"><span class="t">${esc(fName(d.farmer_id))}</span>${pill(DST[d.status]||[d.status])}</div>
    <div class="s">${esc(d.no)} · ${esc(comName(d.com))} · ${fmt(d.tons)} t × ${fmt(d.price)} €/t${d.term?" · "+esc(d.term):""}</div>
    <form class="f sub" data-dedit="${esc(d.id)}"><label>Stav<select name="status">${Object.keys(DST).map(k=>`<option value="${k}"${d.status===k?" selected":""}>${esc(DST[k][0])}</option>`).join("")}</select></label><label>Odvezené t<input name="delivered_t" inputmode="decimal" value="${String(d.delivered_t??0).replace(".",",")}"></label><div class="w btns"><button type="submit">Uložiť zmenu</button></div></form></div>`).join("");
  return h}
function vFarm(){const q=FQ.toLowerCase(),L=STATE.farmers.filter(f=>!q||(f.name+" "+(f.email||"")).toLowerCase().includes(q));const E=EDITF==="new"?{}:STATE.farmers.find(f=>f.id===EDITF);
  let h=`<div class="card"><div class="btns"><button type="button" class="pri" data-fedit="new">+ Pridať farmára</button></div><label>Hľadať<input id="fq" value="${esc(FQ)}" placeholder="meno alebo e-mail"></label>
   <div class="s">„Vytvoriť prihlásenie“ vygeneruje farmárovi heslo a pripraví pozvánku – pošleš ju cez WhatsApp alebo SMS. Prihlási sa e-mailom alebo telefónom a týmto heslom.</div></div>`;
  if(STATE.invite){const I=STATE.invite;h+=`<div class="box"><b>Prihlásenie pre ${esc(I.name)} je pripravené</b><div class="s" style="white-space:pre-wrap;color:var(--ink)">${esc(I.txt)}</div><div class="btns">${I.tel?`<a class="btn lime" href="https://wa.me/${esc(I.tel)}?text=${encodeURIComponent(I.txt)}" target="_blank" rel="noopener">Poslať cez WhatsApp</a><a class="btn" href="sms:+${esc(I.tel)}&body=${encodeURIComponent(I.txt)}">Poslať SMS</a>`:""}<button type="button" data-copyinv>Kopírovať</button><button type="button" data-closeinv>Hotovo</button></div><div class="s">Heslo si nikde neukladáme – pošlite ho farmárovi teraz. Ak ho stratí, vytvorte nové.</div></div>`}
  if(E)h+=farmForm(E);
  h+=L.map(f=>`<div class="card"><div class="row"><span class="t">${esc(f.name)}</span>${!(f.email||f.phone)?pill(["bez kontaktu","w"]):f.active&&f.login?pill(["prihlásenie aktívne"]):f.active?pill(["prístup zapnutý","b"]):pill(["bez prístupu","g"])}</div><div class="s">${esc([f.email,f.phone,f.addr].filter(Boolean).join(" · "))}</div>
    <div class="btns"><button type="button" data-fedit="${esc(f.id)}">Upraviť</button>${(f.email||f.phone)?`<button type="button" class="lime" data-mklogin="${esc(f.id)}">${f.login?"Nové heslo a pozvánka":"Vytvoriť prihlásenie"}</button>`:""}${f.active&&(f.login||f.email)?`<button type="button" class="dng" data-acc="${esc(f.id)}" data-on="0">Vypnúť prístup</button>`:""}${!f.active&&f.login?`<button type="button" data-acc="${esc(f.id)}" data-on="1">Zapnúť prístup</button>`:""}</div></div>`).join("");
  return h}
function farmForm(f){const v=k=>esc(f[k]||"");return `<form class="card f" id="fFarm" data-id="${esc(f.id||"")}"><div class="w t">${f.id?"Upraviť farmára":"Nový farmár"}</div>
  <label class="w">Názov / meno<input name="name" required value="${v("name")}"></label><label>E-mail na prihlásenie<input name="email" type="email" value="${v("email")}"></label><label>Telefón<input name="phone" value="${v("phone")}"></label>
  <label class="w">Adresa<input name="addr" value="${v("addr")}"></label><label>IČO<input name="ico" value="${v("ico")}"></label><label>DIČ<input name="dic" value="${v("dic")}"></label><label>IČ DPH<input name="icdph" value="${v("icdph")}"></label><label>IBAN<input name="iban" value="${v("iban")}"></label>
  <label class="w" style="display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" name="active" style="width:20px;min-height:20px"${f.active===false?"":" checked"}> Prístup povolený</label>
  <div class="w btns"><button class="pri" type="submit">Uložiť</button><button type="button" data-fedit="">Zavrieť</button></div></form>`}

document.addEventListener("click",async e=>{if(!ROLE)return;const t=e.target,g=s=>t.closest(s);let x;
  if(x=g("[data-tab]")){TAB=x.dataset.tab;renderStaff();window.scrollTo(0,0);return}
  if(x=g("[data-done]")||g("[data-rej]")){const id=x.dataset.done||x.dataset.rej,rej=!!x.dataset.rej;const reply=prompt(rej?"Dôvod pre farmára (uvidí ho):":"Odpoveď pre farmára (nepovinné, uvidí ju):",rej?"":"Ozveme sa telefonicky.");if(reply===null)return;
    await upd("requests",id,{status:rej?"zamietnuta":"vybavena",reply:reply||null,handled_by:ME.staffName,handled_at:new Date().toISOString()});return}
  if(x=g("[data-mkdeal]")){const r=STATE.reqs.find(y=>y.id===x.dataset.mkdeal);DEALF={farmer_id:r.farmer_id,com:r.com,tons:r.tons,price:r.price,note:r.note||"",fromReq:r.id};TAB="deals";renderStaff();window.scrollTo(0,0);return}
  if(x=g("[data-clrdeal]")){DEALF=null;renderStaff();return}
  if(x=g("[data-sign]")){const r=STATE.reqs.find(y=>y.id===x.dataset.sign);busy(x,true);const a=await sb.from("deals").update({status:"podpisany",signed_at:new Date().toISOString()}).eq("id",r.deal_id);
    if(a.error){busy(x,false);toast("Chyba: "+a.error.message);return}await upd("requests",r.id,{status:"vybavena",reply:"Zmluva potvrdená.",handled_by:ME.staffName,handled_at:new Date().toISOString()});return}
  if(x=g("[data-fedit]")){EDITF=x.dataset.fedit||null;renderStaff();if(EDITF)window.scrollTo(0,0);return}
  if(x=g("[data-assign]")){ASSIGN=x.dataset.assign||null;renderStaff();return}
  if(x=g("[data-mklogin]")){const f=STATE.farmers.find(y=>y.id===x.dataset.mklogin);let usePhone=false;
    if(f.email&&f.phone)usePhone=!confirm(`Prihlasovať sa bude e-mailom ${f.email}?\n\nOK = e-mail · Zrušiť = telefón ${f.phone}`);
    else usePhone=!f.email;
    const pw=genPw();busy(x,true);const r=await sb.rpc("set_farmer_password",{fid:f.id,pw,use_phone:usePhone});busy(x,false);
    if(r.error){toast("Nepodarilo sa: "+r.error.message,7000);return}
    const who=usePhone?f.phone:f.email;const txt=`Dobrý deň, ERNTE má pre vás aplikáciu s výkupnými cenami, vašimi obchodmi a počasím:\n${APP_URL}\n\nPrihlásenie: ${who}\nHeslo: ${pw}\n\nPo prihlásení si ju dajte na plochu (Zdieľať → Pridať na plochu).`;
    const tel=String(f.phone||"").replace(/\D/g,"").replace(/^00/,"").replace(/^0/,"421");
    STATE.invite={name:f.name,txt,tel};await loadStaff();renderStaff();window.scrollTo(0,0);return}
  if(x=g("[data-copyinv]")){copy(STATE.invite.txt);return}
  if(x=g("[data-closeinv]")){STATE.invite=null;renderStaff();return}
  if(x=g("[data-acc]")){const on=x.dataset.on==="1",f=STATE.farmers.find(y=>y.id===x.dataset.acc);busy(x,true);const ok=await upd("farmers",f.id,{active:on});
    if(ok&&on)copy(`Dobrý deň, ERNTE má pre vás aplikáciu s výkupnými cenami a vašimi obchodmi:\n${APP_URL}\nPrihláste sa e-mailom ${f.email} – príde vám kód. Potom si ju dajte na plochu (Zdieľať → Pridať na plochu).`);return}
  if(x=g("[data-invite]")){const f=STATE.farmers.find(y=>y.id===x.dataset.invite);copy(`Dobrý deň, ERNTE má pre vás aplikáciu s výkupnými cenami a vašimi obchodmi:\n${APP_URL}\nPrihláste sa e-mailom ${f.email} – príde vám kód. Potom si ju dajte na plochu (Zdieľať → Pridať na plochu).`);return}
});
document.addEventListener("input",e=>{if(e.target.id==="fq"){FQ=e.target.value;const p=e.target.selectionStart;renderStaff();const i=$("fq");i.focus();i.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{if(e.target.id==="tDay"){TDAY=e.target.value;renderStaff();return}if(e.target.id==="dCom"){const p=STATE.prices.find(x=>x.com===e.target.value);if(p&&p.price!=null)$("dPrice").value=String(p.price).replace(".",",")}});
async function upd(tbl,id,patch){const {error}=await sb.from(tbl).update(patch).eq("id",id);if(error){toast("Chyba: "+error.message,5000);return false}await loadStaff();renderStaff();toast("Uložené.");return true}
document.addEventListener("submit",async e=>{if(!ROLE)return;const f=e.target,fd=new FormData(f);
  if(f.id==="fPrice"){e.preventDefault();const b=f.querySelector("button");busy(b,true);const now=new Date().toISOString();
    const rows=MK.map(m=>{const v=num(fd.get("p_"+m[0]));return {com:m[0],price:Number.isFinite(v)?Math.round(v*100)/100:null,updated_at:now}});
    const a=await sb.from("prices").upsert(rows);const s=await sb.from("settings").upsert({key:"pricelist",value:{valid:fd.get("valid")||"",by:ME.staffName,at:now}});busy(b,false);
    if(a.error||s.error){toast("Uloženie zlyhalo: "+(a.error||s.error).message,5000);return}await loadStaff();renderStaff();toast("Cenník uložený a zverejnený.");return}
  if(f.id==="fDeal"){e.preventDefault();const tons=num(fd.get("tons")),price=num(fd.get("price"));if(!fd.get("farmer")||!(tons>0)||!Number.isFinite(price)){toast("Doplň farmára, množstvo a cenu.");return}
    const b=f.querySelector("button[type=submit]");busy(b,true);const y=new Date().getFullYear(),n=STATE.deals.filter(d=>String(d.no).startsWith(`ERN-${y}-`)).length+1;
    const row={no:`ERN-${y}-${String(n).padStart(4,"0")}`,farmer_id:fd.get("farmer"),com:fd.get("com"),tons,price,term:fd.get("term")||null,note:fd.get("note")||null};
    const {error}=await sb.from("deals").insert(row);if(error){busy(b,false);toast("Chyba: "+error.message,5000);return}
    if(DEALF&&DEALF.fromReq)await sb.from("requests").update({status:"vybavena",reply:`Pripravili sme zmluvu ${row.no}.`,handled_by:ME.staffName,handled_at:new Date().toISOString()}).eq("id",DEALF.fromReq);
    DEALF=null;await loadStaff();renderStaff();toast("Obchod "+row.no+" uložený. Farmár ho vidí.");return}
  if(f.id==="fAssign"){e.preventDefault();const r=STATE.reqs.find(y=>y.id===f.dataset.req),nos=fd.getAll("tk").map(Number);if(!nos.length){toast("Vyber aspoň jedno auto.");return}
    const b=f.querySelector("button[type=submit]");busy(b,true);
    const rows=nos.map(n=>{const t=STATE.trucks.find(y=>y.no===n);return {farmer_id:r.farmer_id,deal_id:r.deal_id,request_id:r.id,truck_no:n,spz:t.spz,driver:t.driver,driver_phone:t.phone,day:fd.get("day"),time:fd.get("time")||null,note:fd.get("note")||null}});
    const a=await sb.from("trips").insert(rows);if(a.error){busy(b,false);toast("Chyba: "+a.error.message,6000);return}
    await sb.from("requests").update({status:"vybavena",reply:`Pridelené ${rows.length} auto(á) na ${dSK(fd.get("day"))}${fd.get("time")?" od "+fd.get("time"):""}.`,handled_by:ME.staffName,handled_at:new Date().toISOString()}).eq("id",r.id);
    if(r.deal_id)await sb.from("deals").update({status:"odvoz"}).eq("id",r.deal_id).in("status",["navrh","podpisany"]);
    ASSIGN=null;TDAY=fd.get("day");await loadStaff();renderStaff();toast("Autá potvrdené – farmár ich vidí.");return}
  if(f.dataset.tedit){e.preventDefault();const n=num(fd.get("netto"));await upd("trips",f.dataset.tedit,{status:fd.get("status"),netto:Number.isFinite(n)?n:null,updated_at:new Date().toISOString()});return}
  if(f.dataset.tk){e.preventDefault();const {error}=await sb.from("trucks").update({driver:String(fd.get("driver")||"").trim()||null,phone:String(fd.get("phone")||"").trim()||null}).eq("no",+f.dataset.tk);if(error){toast("Chyba: "+error.message);return}await loadStaff();renderStaff();toast("Uložené.");return}
  if(f.dataset.dedit){e.preventDefault();const dt=num(fd.get("delivered_t"));await upd("deals",f.dataset.dedit,{status:fd.get("status"),delivered_t:Number.isFinite(dt)?dt:0});return}
  if(f.id==="fFarm"){e.preventDefault();const row={};["name","email","phone","addr","ico","dic","icdph","iban"].forEach(k=>{const v=String(fd.get(k)||"").trim();row[k]=v||null});
    if(row.email)row.email=row.email.toLowerCase();row.active=!!fd.get("active");const id=f.dataset.id;
    const r=id?await sb.from("farmers").update(row).eq("id",id):await sb.from("farmers").insert(row);
    if(r.error){toast(r.error.code==="23505"?"Tento e-mail už má iný farmár.":"Chyba: "+r.error.message,5000);return}EDITF=null;await loadStaff();renderStaff();toast("Farmár uložený.");return}
});

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script>
</body>
</html>
