<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ERNTE Farmár</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ERNTE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ERNTE – sklo, žiara, profesionálna typografia. Tmavá nočná scéna s farebnou žiarou, sklenené karty, Unbounded nadpisy + Sora text + Plex Mono čísla. */
:root{
  --bg:#05070a; --ink:#f2f5ff; --muted:#9aa3b8; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --glass:rgba(22,27,38,.55); --glass2:rgba(255,255,255,.05); --field:rgba(255,255,255,.06);
  --lime:#b6ff3b; --mint:#5eead4; --violet:#7c5cff; --cyan:#22d3ee; --green:#0d2a17;
  --grad:linear-gradient(135deg,#b6ff3b,#5eead4); --grad2:linear-gradient(135deg,#7c5cff,#22d3ee);
  --warn:#ffcf5a; --bad:#ff6b81; --blue:#7cc4ff;
  --f-head:"Unbounded","Sora",system-ui,sans-serif; --f-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:400 15px/1.5 var(--f-ui);-webkit-text-size-adjust:100%;min-height:100vh;
  background:radial-gradient(60% 40% at 90% -5%,rgba(124,92,255,.38),transparent 70%),radial-gradient(55% 40% at -10% 30%,rgba(34,211,238,.22),transparent 70%),radial-gradient(50% 35% at 70% 105%,rgba(182,255,59,.18),transparent 70%),var(--bg);
  background-attachment:fixed;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:14px}
header.top{display:flex;align-items:center;gap:12px;padding:16px 0 6px}
header.top img{height:44px;width:auto;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 8px 30px rgba(182,255,59,.18)}
header.top .tt{flex:1;min-width:0}
header.top h1{margin:0;font:600 1.12rem/1.15 var(--f-head);letter-spacing:-.02em}
header.top small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.out{min-height:38px;padding:0 14px;font-size:.78rem}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px;display:grid;gap:6px;color:#fff;
  background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(34,211,238,.18) 55%,rgba(182,255,59,.20));border:1px solid var(--line2);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 24px 60px rgba(0,0,0,.45)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(182,255,59,.45),transparent 70%);filter:blur(10px);pointer-events:none}
.hero small{color:rgba(255,255,255,.75);font-size:.8rem;position:relative}
.hero b{font:600 1.45rem/1.15 var(--f-head);letter-spacing:-.02em;position:relative;overflow-wrap:anywhere}
h2{margin:12px 4px 0;font:600 .7rem var(--f-head);letter-spacing:.16em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px 18px;display:grid;gap:10px;min-width:0;
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 18px 44px rgba(0,0,0,.35)}
.card .t{font:600 1rem var(--f-head);letter-spacing:-.01em}.s{font-size:.82rem;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.88rem}
.num,.row b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font:600 .7rem var(--f-num);background:rgba(182,255,59,.14);color:var(--lime);border:1px solid rgba(182,255,59,.35);white-space:nowrap}
.pill.w{background:rgba(255,207,90,.12);color:var(--warn);border-color:rgba(255,207,90,.35)}.pill.b{background:rgba(124,196,255,.12);color:var(--blue);border-color:rgba(124,196,255,.35)}
.pill.g{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--line)}.pill.r{background:rgba(255,107,129,.12);color:var(--bad);border-color:rgba(255,107,129,.35)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:600 .9rem var(--f-ui);min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .12s,box-shadow .2s}
button:active,.btn:active{transform:scale(.98)}
button.pri,.btn.pri{background:var(--grad2);border-color:transparent;color:#fff;box-shadow:0 8px 26px rgba(124,92,255,.40)}
button.lime,.btn.lime{background:var(--grad);border-color:transparent;color:#06110a;box-shadow:0 8px 26px rgba(182,255,59,.30)}
button.dng{color:var(--bad);border-color:rgba(255,107,129,.4);background:rgba(255,107,129,.06)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
form.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
form.f .w{grid-column:1/-1}
label{display:grid;gap:5px;font-size:.76rem;color:var(--muted);min-width:0;letter-spacing:.01em}
input,select,textarea{font:500 1rem var(--f-ui);color:var(--ink);background:var(--field);border:1px solid var(--line2);border-radius:14px;padding:11px 13px;min-height:48px;width:100%;min-width:0}
select option{background:#111621;color:var(--ink)}
input::placeholder{color:rgba(154,163,184,.6)}
textarea{min-height:80px}
input.code{font:600 1.7rem var(--f-num);letter-spacing:.35em;text-align:center}input.code:placeholder-shown{letter-spacing:normal}
.tabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 0 6px;scrollbar-width:none;
  background:linear-gradient(180deg,rgba(5,7,10,.92),rgba(5,7,10,.70));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:42px;border-radius:999px;position:relative;font-weight:600}
.tabs button[aria-pressed=true]{background:var(--grad);color:#06110a;border-color:transparent;box-shadow:0 6px 22px rgba(182,255,59,.28)}
.tabs .cnt{background:var(--bad);color:#fff;border-radius:999px;font:600 .7rem var(--f-num);padding:1px 7px;box-shadow:0 0 12px rgba(255,107,129,.7)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:2px}
.prow .t{font:600 1rem var(--f-head);letter-spacing:-.01em}.prow .num{font-size:1.08rem;white-space:nowrap;color:#fff;text-shadow:0 0 18px rgba(182,255,59,.35)}
.prow .sell{min-height:44px}
.prow form{grid-column:1/-1}
.box{background:linear-gradient(135deg,rgba(182,255,59,.10),rgba(94,234,212,.06));border:1px solid rgba(182,255,59,.28);border-radius:20px;padding:14px 16px;font-size:.88rem;display:grid;gap:8px}
.box b{color:#fff}
.box.w{background:rgba(255,207,90,.08);border-color:rgba(255,207,90,.3);color:var(--warn)}
.sub{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:9px 11px}.kpi small{display:block;font-size:.68rem;color:var(--muted);letter-spacing:.04em}.kpi b{font:600 1rem var(--f-num)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;transition:.25s;
  background:rgba(18,22,32,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(182,255,59,.4);color:#fff;padding:13px 18px;border-radius:16px;font-weight:600;font-size:.9rem;max-width:min(92vw,520px);z-index:50;pointer-events:none;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 24px rgba(182,255,59,.18)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.center{min-height:60vh;display:grid;align-content:center;gap:16px}
.copy{border:0;background:none;padding:0;min-height:0;color:var(--lime);font:600 .9rem var(--f-num);text-decoration:none;display:inline}
@media (max-width:460px){form.f{grid-template-columns:1fr}}
.cimg{width:64px;height:64px;border-radius:16px;overflow:hidden;flex:none;background:linear-gradient(135deg,rgba(182,255,59,.25),rgba(124,92,255,.25));border:1px solid var(--line2);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.cimg img,.cban img{width:100%;height:100%;object-fit:cover;display:block}
.prow{grid-template-columns:64px minmax(0,1fr) auto auto}
.prow form{grid-column:1/-1}
.cban{display:block;height:120px;margin:-16px -18px 2px;border-radius:22px 22px 0 0;overflow:hidden;position:relative;background:linear-gradient(135deg,rgba(182,255,59,.2),rgba(124,92,255,.25))}
.cban::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,13,20,.85))}
@media (max-width:460px){.prow{grid-template-columns:56px minmax(0,1fr) auto}.cimg{width:56px;height:56px;border-radius:14px}.prow .sell{grid-column:1/-1}}

.wxhs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;margin:0 -4px}.wxhs::-webkit-scrollbar{display:none}
.wxh{flex:none;width:62px;display:grid;justify-items:center;gap:3px;padding:10px 4px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.wxh:first-child{background:linear-gradient(160deg,rgba(182,255,59,.18),rgba(94,234,212,.08));border-color:rgba(182,255,59,.4)}
.wxh small{font:600 .7rem var(--f-num);color:var(--muted)}.wxh span{font-size:1.3rem;line-height:1}.wxh b{font:600 1rem var(--f-num)}.wxh em{font:500 .62rem var(--f-num);font-style:normal;color:var(--cyan)}
.wxds{display:grid;gap:2px}
.wxd{display:grid;grid-template-columns:64px 30px 1fr minmax(120px,1.4fr);align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--line);font-size:.84rem}
.wxd:first-child{border-top:0}.wxd .dn{font-weight:600}.wxd .di{font-size:1.25rem}.wxd .dr{font:500 .72rem var(--f-num);color:var(--cyan)}
.wxd .dt{display:flex;align-items:center;gap:6px;font-family:var(--f-num)}.wxd .dt b{font-weight:600;font-size:.86rem;min-width:30px;text-align:right}.wxd .dt b.lo{color:var(--muted);text-align:left}
.bar{position:relative;flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.08)}.bar i{position:absolute;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#22d3ee,#b6ff3b,#ffb020);box-shadow:0 0 10px rgba(182,255,59,.4)}
@media (max-width:420px){.wxd{grid-template-columns:54px 26px 1fr;}.wxd .dt{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.toast,button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><img src="logo.png" alt="ERNTE"><div class="tt"><h1 id="hT">ERNTE Farmár</h1><small id="hS">výkup komodít</small></div><button type="button" class="out" id="outBtn" hidden>Odhlásiť</button></header>
  <main id="app" class="wrap" aria-live="polite"><div class="card"><div class="t">Načítavam…</div></div></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const MK=[["repka","Repka"],["lo","LO slnečnica"],["ho","HO slnečnica"],["soja","Sója"],["psenica_p","Pšenica potravinárska"],["psenica_k","Pšenica kŕmna"],["jacmen_k","Jačmeň kŕmny"],["jacmen_s","Jačmeň sladovnícky"],["kukurica","Kukurica"],["cirok","Cirok"]];
const SPEC={kukurica:[14,2,1],soja:[12,2,1],psenica_k:[13,2],psenica_p:[14,2],jacmen_s:[14.5,2],jacmen_k:[14,2],repka:[8,2],lo:[9,2],ho:[9,2],cirok:[14,2]};
const DST={navrh:["čaká na podpis","g"],podpisany:["podpísaný",""],odvoz:["odvoz beží","b"],odvezeny:["odvezený",""],fakturacia:["fakturácia","w"],zaplateny:["zaplatený",""],zruseny:["zrušený","r"]};
const RST={nova:["čaká na ERNTE","w"],vybavena:["vybavené",""],zamietnuta:["zamietnuté","r"]};
const RKIND={sell:"Chcem predať",transport:"Objednávka odvozu",agree:"Súhlas so zmluvou",message:"Správa"};

const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=s=>{if(s==null||s==="")return NaN;if(typeof s==="number")return s;return Number(String(s).replace(/\s/g,"").replace(",","."))};
const fmt=(x,d=2)=>Number.isFinite(+x)&&x!==null&&x!==""?(+x).toLocaleString("sk-SK",{minimumFractionDigits:d,maximumFractionDigits:d}):"–";
const dSK=d=>{if(!d)return "";const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${+m[3]}. ${+m[2]}. ${m[1]}`:String(d)};
const dtSK=d=>d?new Date(d).toLocaleString("sk-SK",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}):"";
const comName=c=>(MK.find(m=>m[0]===c)||[c,c||"–"])[1];
const specLine=c=>{const s=SPEC[c];return s?`vlhkosť max. ${String(s[0]).replace(".",",")} %, nečistoty max. ${s[1]} %${s[2]?", Non-GMO":""}`:""};
const IMG={repka:"Rapsfeld Rapeseed Brassica napus.jpg",lo:"Sunflower (Helianthus annuus) seeds.jpg",ho:"Sonnenblumenkerne sunflower seeds.jpg",soja:"Soybeans.jpg",psenica_p:"Wheat close-up.JPG",psenica_k:"Wheat grain.jpg",jacmen_k:"Barley grains.jpg",jacmen_s:"Barley.jpg",kukurica:"Maize Corn.jpg",cirok:"Sorghum.jpg"};
const imgUrl=c=>IMG[c]?"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(IMG[c].replace(/ /g,"_"))+"?width=400":"";
const comImg=(c,cls="cimg")=>IMG[c]?`<span class="${cls}"><img src="${imgUrl(c)}" alt="${esc(comName(c))}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'"></span>`:"";
const pill=a=>`<span class="pill ${a[1]||""}">${esc(a[0])}</span>`;
const today=()=>new Date().toISOString().slice(0,10);
function toast(t,ms=3500){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),ms)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Skopírované.")}catch(e){prompt("Skopírujte:",t)}}
function busy(btn,on){if(!btn)return;btn.disabled=on;if(on){btn._t=btn.textContent;btn.textContent="Chvíľu…"}else if(btn._t)btn.textContent=btn._t}
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;

const CFG=window.ERNTE_CONFIG||{};
let sb=null,ME=null,ROLE=null,FARMER=null,STATE={};
const APP_URL=location.origin+location.pathname.replace(/index\.html$/,"");

// ================= štart =================
async function boot(){
  if(!CFG.SUPABASE_URL||!CFG.SUPABASE_KEY||!window.supabase){$("app").innerHTML=`<div class="card"><div class="t">Aplikácia ešte nie je pripojená na databázu.</div><div class="s">Doplňte config.js.</div></div>`;return}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"){ME=null;showLogin()}});
  const {data}=await sb.auth.getSession();
  if(data&&data.session)await enter(data.session.user);else showLogin();
}

// ================= prihlásenie =================
let LOGIN={email:"",sent:false};
function showLogin(){$("outBtn").hidden=true;$("hS").textContent="výkup komodít";
  const A=$("app");
  if(!LOGIN.sent){A.innerHTML=`<div class="center"><div class="hero"><small>Vitajte</small><b>Prihlásenie</b><small>Farmári aj ERNTE (správa) – zadajte svoj e-mail. Aplikácia podľa neho otvorí váš pohľad.</small></div>
    <form class="card" id="fEmail"><label>Váš e-mail<input name="email" type="email" inputmode="email" autocomplete="email" required value="${esc(LOGIN.email)}" placeholder="meno@firma.sk"></label><label>Heslo <span style="font-weight:400">(ak ste si ho nastavili – inak nechajte prázdne)</span><input name="pw" type="password" autocomplete="current-password"></label><button class="pri" type="submit">Prihlásiť / poslať kód</button></form>${installHint()}</div>`}
  else{A.innerHTML=`<div class="center"><div class="hero"><small>Kód sme poslali na</small><b>${esc(LOGIN.email)}</b><small>Pozrite si e-mail (aj priečinok Spam) a opíšte kód. Ak je v e-maile iba tlačidlo „Log In“, podržte na ňom prst → Kopírovať odkaz a vložte ho sem.</small></div>
    <form class="card" id="fCode"><label>Kód z e-mailu<input class="code" name="code" inputmode="numeric" autocomplete="one-time-code" required></label><button class="pri" type="submit">Prihlásiť</button><button type="button" id="backEmail">Zmeniť e-mail / poslať znova</button></form></div>`;
    setTimeout(()=>{const i=document.querySelector("input.code");if(i)i.focus()},50)}
}
function pwCard(){return `<form class="card" id="fPw"><div class="t">Heslo na rýchle prihlásenie</div><div class="s">Nastavte si heslo a nabudúce sa prihlásite e-mailom a heslom – bez čakania na e-mail. Funguje aj v ikone na ploche.</div><label>Nové heslo (aspoň 8 znakov)<input name="pw" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">Uložiť heslo</button></form>`}
document.addEventListener("submit",async e=>{const f=e.target;if(f.id!=="fPw")return;e.preventDefault();const b=f.querySelector("button");busy(b,true);
  const {error}=await sb.auth.updateUser({password:String(new FormData(f).get("pw"))});busy(b,false);
  if(error){toast("Heslo sa neuložilo: "+error.message,5000);return}f.reset();toast("Heslo uložené. Odteraz sa prihlásite e-mailom a heslom.",5000)},true);
function installHint(){if(isStandalone())return "";const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="box"><b>Tip: dajte si ERNTE na plochu</b><div>${ios?"V Safari ťuknite dole na <b>Zdieľať</b> (štvorček so šípkou) → <b>Pridať na plochu</b>.":"V prehliadači otvorte ponuku <b>⋮</b> → <b>Pridať na plochu</b> / <b>Inštalovať aplikáciu</b>."} Potom ERNTE otvárate ako aplikáciu.</div></div>`}

document.addEventListener("submit",async e=>{const f=e.target;
  if(f.id==="fEmail"){e.preventDefault();const b=f.querySelector("button");busy(b,true);LOGIN.email=String(new FormData(f).get("email")).trim().toLowerCase();
    const pw=String(new FormData(f).get("pw")||"");
    if(pw){const r=await sb.auth.signInWithPassword({email:LOGIN.email,password:pw});busy(b,false);if(r.error){toast("Nesprávny e-mail alebo heslo.",4500);return}await enter(r.data.user);return}
    const {error}=await sb.auth.signInWithOtp({email:LOGIN.email,options:{shouldCreateUser:true,emailRedirectTo:APP_URL}});busy(b,false);
    if(error){toast(error.status===429?"Príliš veľa pokusov, skúste o minútu.":"Kód sa nepodarilo poslať: "+error.message,5000);return}
    LOGIN.sent=true;showLogin();return}
  if(f.id==="fCode"){e.preventDefault();const b=f.querySelector("button");busy(b,true);let raw=String(new FormData(f).get("code")).trim();let data,error;for(let i=0;i<3&&/%3F|%26|%3D/i.test(raw);i++){try{raw=decodeURIComponent(raw)}catch(x){break}}

const WX_DEF={name:"Michalovce",lat:48.755,lon:21.915};
let WXLOC=(()=>{try{return JSON.parse(localStorage.getItem("ernte-wxloc"))||WX_DEF}catch(e){return WX_DEF}})(),WXD=null,WXAT=0;
const WMO=c=>c===0?["☀️","jasno"]:c<=2?["🌤️","polojasno"]:c===3?["☁️","zamračené"]:c<=48?["🌫️","hmla"]:c<=57?["🌦️","mrholenie"]:c<=67?["🌧️","dážď"]:c<=77?["🌨️","sneh"]:c<=82?["🌧️","prehánky"]:c<=86?["🌨️","snehové prehánky"]:["⛈️","búrka"];
async function loadWx(force){if(!force&&WXD&&Date.now()-WXAT<15*60e3)return;
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${WXLOC.lat}&longitude=${WXLOC.lon}&hourly=temperature_2m,precipitation,precipitation_probability,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max&timezone=Europe%2FBratislava&forecast_days=7`;
  try{const r=await fetch(u);WXD=await r.json();WXAT=Date.now()}catch(e){WXD={err:1}}}
function wxCard(){if(!WXD)return `<div class="card"><div class="s">Načítavam počasie…</div></div>`;if(WXD.err||!WXD.daily)return `<div class="card"><div class="s">Počasie sa nepodarilo načítať.</div></div>`;
  const H=WXD.hourly,D=WXD.daily,now=Date.now();let i0=H.time.findIndex(t=>new Date(t).getTime()>now-3600e3);if(i0<0)i0=0;
  const hrs=H.time.slice(i0,i0+24).map((t,k)=>{const i=i0+k,w=WMO(H.weather_code[i]);return `<div class="wxh"><small>${new Date(t).getHours()}:00</small><span>${w[0]}</span><b>${Math.round(H.temperature_2m[i])}°</b><em>${H.precipitation[i]>0?H.precipitation[i].toFixed(1)+" mm":(H.precipitation_probability[i]??0)+" %"}</em></div>`}).join("");
  const tmin=Math.min(...D.temperature_2m_min),tmax=Math.max(...D.temperature_2m_max),rng=Math.max(1,tmax-tmin);
  const days=D.time.map((t,i)=>{const w=WMO(D.weather_code[i]),d=new Date(t+"T12:00");const nm=i===0?"Dnes":i===1?"Zajtra":d.toLocaleDateString("sk-SK",{weekday:"short",day:"numeric",month:"numeric"});
    const a=(D.temperature_2m_min[i]-tmin)/rng*100,b=(D.temperature_2m_max[i]-tmin)/rng*100;
    return `<div class="wxd"><span class="dn">${esc(nm)}</span><span class="di" title="${w[1]}">${w[0]}</span><span class="dr">${D.precipitation_sum[i]>0?D.precipitation_sum[i].toFixed(1)+" mm":"–"} · ${D.precipitation_probability_max[i]??0} %</span><span class="dt"><b class="lo">${Math.round(D.temperature_2m_min[i])}°</b><i class="bar"><i style="left:${a}%;right:${100-b}%"></i></i><b>${Math.round(D.temperature_2m_max[i])}°</b></span></div>`}).join("");
  return `<div class="card wx"><div class="row"><span class="t">📍 ${esc(WXLOC.name)}</span><button type="button" class="out" data-wxloc>Moja poloha</button></div>
    <div class="wxhs">${hrs}</div><div class="wxds">${days}</div>
    <div class="s" style="font-size:.7rem">Predpoveď: Open-Meteo · <a class="copy" style="font-size:.7rem" href="https://www.pocasieradar.sk/" target="_blank" rel="noopener">Radar zrážok – pocasieradar.sk</a></div></div>`}
document.addEventListener("click",e=>{if(!e.target.closest("[data-wxloc]"))return;if(!navigator.geolocation){toast("Poloha nie je dostupná.");return}
  toast("Zisťujem polohu…");navigator.geolocation.getCurrentPosition(async p=>{WXLOC={name:"Moja poloha",lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3)};try{localStorage.setItem("ernte-wxloc",JSON.stringify(WXLOC))}catch(x){}await loadWx(true);rerender()},()=>toast("Polohu sa nepodarilo zistiť – povoľte ju v nastaveniach."),{timeout:10000})});

function vFarm(){const q=FQ.toLowerCase(),L=STATE.farmers.filter(f=>!q||(f.name+" "+(f.email||"")).toLowerCase().includes(q));const E=EDITF==="new"?{}:STATE.farmers.find(f=>f.id===EDITF);
  let h=`<div class="card"><div class="btns"><button type="button" class="pri" data-fedit="new">+ Pridať farmára</button></div><label>Hľadať<input id="fq" value="${esc(FQ)}" placeholder="meno alebo e-mail"></label>
   <div class="s">Do aplikácie sa dostane iba farmár so zapnutým prístupom. „Zapnúť prístup a pozvať“ prístup zapne a skopíruje pozvánku, ktorú mu pošleš.</div></div>`;
  if(E)h+=farmForm(E);
  h+=L.map(f=>`<div class="card"><div class="row"><span class="t">${esc(f.name)}</span>${!f.email?pill(["bez e-mailu","w"]):f.active?pill(["prístup zapnutý"]):pill(["bez prístupu","g"])}</div><div class="s">${esc([f.email,f.phone,f.addr].filter(Boolean).join(" · "))}</div>
    <div class="btns"><button type="button" data-fedit="${esc(f.id)}">Upraviť</button>${f.email?(f.active?`<button type="button" data-invite="${esc(f.id)}">Kopírovať pozvánku</button><button type="button" class="dng" data-acc="${esc(f.id)}" data-on="0">Vypnúť prístup</button>`:`<button type="button" class="lime" data-acc="${esc(f.id)}" data-on="1">Zapnúť prístup a pozvať</button>`):""}</div></div>`).join("");
  return h}
function farmForm(f){const v=k=>esc(f[k]||"");return `<form class="card f" id="fFarm" data-id="${esc(f.id||"")}"><div class="w t">${f.id?"Upraviť farmára":"Nový farmár"}</div>
  <label class="w">Názov / meno<input name="name" required value="${v("name")}"></label><label>E-mail na prihlásenie<input name="email" type="email" value="${v("email")}"></label><label>Telefón<input name="phone" value="${v("phone")}"></label>
  <label class="w">Adresa<input name="addr" value="${v("addr")}"></label><label>IČO<input name="ico" value="${v("ico")}"></label><label>DIČ<input name="dic" value="${v("dic")}"></label><label>IČ DPH<input name="icdph" value="${v("icdph")}"></label><label>IBAN<input name="iban" value="${v("iban")}"></label>
  <label class="w" style="display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" name="active" style="width:20px;min-height:20px"${f.active===false?"":" checked"}> Prístup povolený</label>
  <div class="w btns"><button class="pri" type="submit">Uložiť</button><button type="button" data-fedit="">Zavrieť</button></div></form>`}

document.addEventListener("click",async e=>{if(!ROLE)return;const t=e.target,g=s=>t.closest(s);let x;
  if(x=g("[data-tab]")){TAB=x.dataset.tab;renderStaff();window.scrollTo(0,0);return}
  if(x=g("[data-done]")||g("[data-rej]")){const id=x.dataset.done||x.dataset.rej,rej=!!x.dataset.rej;const reply=prompt(rej?"Dôvod pre farmára (uvidí ho):":"Odpoveď pre farmára (nepovinné, uvidí ju):",rej?"":"Ozveme sa telefonicky.");if(reply===null)return;
    await upd("requests",id,{status:rej?"zamietnuta":"vybavena",reply:reply||null,handled_by:ME.staffName,handled_at:new Date().toISOString()});return}
  if(x=g("[data-mkdeal]")){const r=STATE.reqs.find(y=>y.id===x.dataset.mkdeal);DEALF={farmer_id:r.farmer_id,com:r.com,tons:r.tons,price:r.price,note:r.note||"",fromReq:r.id};TAB="deals";renderStaff();window.scrollTo(0,0);return}
  if(x=g("[data-clrdeal]")){DEALF=null;renderStaff();return}
  if(x=g("[data-sign]")){const r=STATE.reqs.find(y=>y.id===x.dataset.sign);busy(x,true);const a=await sb.from("deals").update({status:"podpisany",signed_at:new Date().toISOString()}).eq("id",r.deal_id);
    if(a.error){busy(x,false);toast("Chyba: "+a.error.message);return}await upd("requests",r.id,{status:"vybavena",reply:"Zmluva potvrdená.",handled_by:ME.staffName,handled_at:new Date().toISOString()});return}
  if(x=g("[data-fedit]")){EDITF=x.dataset.fedit||null;renderStaff();if(EDITF)window.scrollTo(0,0);return}
  if(x=g("[data-acc]")){const on=x.dataset.on==="1",f=STATE.farmers.find(y=>y.id===x.dataset.acc);busy(x,true);const ok=await upd("farmers",f.id,{active:on});
    if(ok&&on)copy(`Dobrý deň, ERNTE má pre vás aplikáciu s výkupnými cenami a vašimi obchodmi:\n${APP_URL}\nPrihláste sa e-mailom ${f.email} – príde vám kód. Potom si ju dajte na plochu (Zdieľať → Pridať na plochu).`);return}
  if(x=g("[data-invite]")){const f=STATE.farmers.find(y=>y.id===x.dataset.invite);copy(`Dobrý deň, ERNTE má pre vás aplikáciu s výkupnými cenami a vašimi obchodmi:\n${APP_URL}\nPrihláste sa e-mailom ${f.email} – príde vám kód. Potom si ju dajte na plochu (Zdieľať → Pridať na plochu).`);return}
});
document.addEventListener("input",e=>{if(e.target.id==="fq"){FQ=e.target.value;const p=e.target.selectionStart;renderStaff();const i=$("fq");i.focus();i.setSelectionRange(p,p)}});
document.addEventListener("change",e=>{if(e.target.id==="dCom"){const p=STATE.prices.find(x=>x.com===e.target.value);if(p&&p.price!=null)$("dPrice").value=String(p.price).replace(".",",")}});
async function upd(tbl,id,patch){const {error}=await sb.from(tbl).update(patch).eq("id",id);if(error){toast("Chyba: "+error.message,5000);return false}await loadStaff();renderStaff();toast("Uložené.");return true}
document.addEventListener("submit",async e=>{if(!ROLE)return;const f=e.target,fd=new FormData(f);
  if(f.id==="fPrice"){e.preventDefault();const b=f.querySelector("button");busy(b,true);const now=new Date().toISOString();
    const rows=MK.map(m=>{const v=num(fd.get("p_"+m[0]));return {com:m[0],price:Number.isFinite(v)?Math.round(v*100)/100:null,updated_at:now}});
    const a=await sb.from("prices").upsert(rows);const s=await sb.from("settings").upsert({key:"pricelist",value:{valid:fd.get("valid")||"",by:ME.staffName,at:now}});busy(b,false);
    if(a.error||s.error){toast("Uloženie zlyhalo: "+(a.error||s.error).message,5000);return}await loadStaff();renderStaff();toast("Cenník uložený a zverejnený.");return}
  if(f.id==="fDeal"){e.preventDefault();const tons=num(fd.get("tons")),price=num(fd.get("price"));if(!fd.get("farmer")||!(tons>0)||!Number.isFinite(price)){toast("Doplň farmára, množstvo a cenu.");return}
    const b=f.querySelector("button[type=submit]");busy(b,true);const y=new Date().getFullYear(),n=STATE.deals.filter(d=>String(d.no).startsWith(`ERN-${y}-`)).length+1;
    const row={no:`ERN-${y}-${String(n).padStart(4,"0")}`,farmer_id:fd.get("farmer"),com:fd.get("com"),tons,price,term:fd.get("term")||null,note:fd.get("note")||null};
    const {error}=await sb.from("deals").insert(row);if(error){busy(b,false);toast("Chyba: "+error.message,5000);return}
    if(DEALF&&DEALF.fromReq)await sb.from("requests").update({status:"vybavena",reply:`Pripravili sme zmluvu ${row.no}.`,handled_by:ME.staffName,handled_at:new Date().toISOString()}).eq("id",DEALF.fromReq);
    DEALF=null;await loadStaff();renderStaff();toast("Obchod "+row.no+" uložený. Farmár ho vidí.");return}
  if(f.dataset.dedit){e.preventDefault();const dt=num(fd.get("delivered_t"));await upd("deals",f.dataset.dedit,{status:fd.get("status"),delivered_t:Number.isFinite(dt)?dt:0});return}
  if(f.id==="fFarm"){e.preventDefault();const row={};["name","email","phone","addr","ico","dic","icdph","iban"].forEach(k=>{const v=String(fd.get(k)||"").trim();row[k]=v||null});
    if(row.email)row.email=row.email.toLowerCase();row.active=!!fd.get("active");const id=f.dataset.id;
    const r=id?await sb.from("farmers").update(row).eq("id",id):await sb.from("farmers").insert(row);
    if(r.error){toast(r.error.code==="23505"?"Tento e-mail už má iný farmár.":"Chyba: "+r.error.message,5000);return}EDITF=null;await loadStaff();renderStaff();toast("Farmár uložený.");return}
});

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script>
</body>
</html>
