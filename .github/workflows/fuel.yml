# ⛽ Nafta v krajinách MOL Group (Slovnaft SK, MOL HU, CZ, AT, SI, HR, RO, PL) – verejné údaje
#   EU Weekly Oil Bulletin cez fuel-prices.eu (CC BY 4.0, „Source: fuel-prices.eu, European Commission Weekly Oil Bulletin“)
#   + MOL Maďarsko z holtankoljak.hu (priemer staníc MOL), ak je dostupné. Výsledok: vetva fuel-data / fuel.json (číta ho úvod aplikácie).
name: fuel
on:
  schedule:
    - cron: "17 5,11,17 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [ernte-fuel]
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stiahnuť ceny nafty
        run: |
          set +e
          mkdir -p o && cd o
          B="https://www.fuel-prices.eu"
          curl -s -m 30 -A "Mozilla/5.0 ERNTE" "$B/charts/data.json?type=map&fuel=diesel" -o eu.json
          curl -s -m 30 -A "Mozilla/5.0 ERNTE" "$B/live/api.php?action=summary" -o live.json
          for c in SK HU CZ AT SI HR RO PL; do
            curl -s -m 30 -A "Mozilla/5.0 ERNTE" "$B/lang/api/country-history.php?cc=$c" -o h_$c.json
            curl -s -m 30 -A "Mozilla/5.0 ERNTE" "$B/live/api.php?action=brands&country=$c&fuel=diesel" -o b_$c.json
          done
          python3 - <<'PY'
          import json,datetime
          C=["SK","HU","CZ","AT","SI","HR","RO","PL"]
          def L(f):
            try: return json.load(open(f))
            except Exception: return None
          out={"at":datetime.datetime.utcnow().isoformat()+"Z","credit":"Source: fuel-prices.eu, European Commission Weekly Oil Bulletin (CC BY 4.0)","c":{}}
          eu=L("eu.json") or {}
          for r in eu.get("rows",[]):
            if r.get("country_code") in C: out["c"].setdefault(r["country_code"],{})["w"]={"p":float(r["price"]),"d":r.get("date")}
          lv=L("live.json");out["live_raw"]=json.dumps(lv)[:1500] if lv else None
          for c in C:
            h=L(f"h_{c}.json")
            if isinstance(h,dict) and h.get("labels"):
              pts=[[d,float(v)] for d,v in zip(h["labels"],h.get("diesel",[])) if v not in (0,"0",None)]
              out["c"].setdefault(c,{})["h"]=pts[-30:]
            b=L(f"b_{c}.json")
            if b is not None: out["c"].setdefault(c,{})["b_raw"]=json.dumps(b,ensure_ascii=False)[:1200]
          json.dump(out,open("fuel.json","w"),ensure_ascii=False)
          print(json.dumps(out,ensure_ascii=False)[:4000])
          PY
          rm -f *.json.tmp eu.json live.json h_*.json b_*.json
          git init -q; git checkout -q -b fuel-data
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add fuel.json; git commit -qm "nafta $(date -u +%F)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fuel-data
