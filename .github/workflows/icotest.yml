name: icotest
on:
  repository_dispatch:
    types: [ernte-icotest]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test verejných registrov (iba verejné údaje firiem)
        run: |
          set +e
          ICO="${{ github.event.client_payload.ico || '52341356' }}"
          O=-H; H="Origin: https://ernte-trade.github.io"
          {
          NM="${{ github.event.client_payload.name || 'ABG Trebišov' }}"; NE=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$NM")
          echo "== RPO fullName"; curl -s -m 20 -D - -H "$H" "https://api.statistics.sk/rpo/v1/search?fullName=$NE&onlyActive=true" | head -c 5000; echo
          echo "== FUEL raw"; curl -s -m 20 -D - -o /dev/null -H "$H" "https://raw.githubusercontent.com/ernte-trade/ernte-/fuel-data/fuel.json" | grep -i "^HTTP\|access-control-allow-origin\|content-type"
          echo "== OVERPASS"; Q='[out:json][timeout:12];nwr["amenity"="fuel"][~"^(brand|name|operator)$"~"Slovnaft",i](around:20000,48.7547,21.9195);out center 5;'; curl -s -m 25 -D - -H "$H" -A "Mozilla/5.0 (Linux; Android 14) Chrome/130 Mobile" -H "Accept: */*" -H "Referer: https://ernte-trade.github.io/" --get --data-urlencode "data=$Q" "https://overpass-api.de/api/interpreter" | grep -i "^HTTP\|access-control-allow-origin\|\"brand\"\|\"name\"\|\"lat\"" | head -12
          echo "== MX"; dig +short MX ernte.sk; dig +short TXT ernte.sk | head -5; dig +short autodiscover.ernte.sk; dig +short CNAME autoconfig.ernte.sk; dig +short A mail.ernte.sk; dig +short A smtp.ernte.sk
          echo "== LIVE zmeny"; curl -s -m 20 "https://ernte-trade.github.io/ernte-/farmar/zmeny.json?u=$RANDOM" | head -c 400; echo; curl -s -m 20 -o /dev/null -w "%{http_code}\n" "https://ernte-trade.github.io/ernte-/farmar/beta/verzia.js"
          echo "== RPO search"; curl -s -m 20 -D - -H "$H" "https://api.statistics.sk/rpo/v1/search?identifier=$ICO" | head -c 6000; echo
          echo "== RUZ list"; curl -s -m 20 -D - -H "$H" "https://www.registeruz.sk/cruz-public/api/uctovne-jednotky?zmenene-od=2000-01-01&ico=$ICO" | head -c 3000; echo
          ID=$(curl -s -m 20 "https://www.registeruz.sk/cruz-public/api/uctovne-jednotky?zmenene-od=2000-01-01&ico=$ICO" | grep -o '"id":\[[0-9]*' | grep -o '[0-9]*$' | head -1)
          echo "== RUZ detail $ID"; curl -s -m 20 -D - -H "$H" "https://www.registeruz.sk/cruz-public/api/uctovna-jednotka?id=$ID" | head -c 4000; echo
          RID=$(curl -s -m 20 "https://api.statistics.sk/rpo/v1/search?identifier=$ICO" | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
          echo "== RPO entity $RID"; curl -s -m 20 -D - -H "$H" "https://api.statistics.sk/rpo/v1/entity/$RID?showHistoricalData=false&showOrganizationUnits=false" | head -c 6000; echo
          K="sb_publishable_AOel6p4QZFP_-t4sSoziAA_ESUooutQ"; U="https://cflliscddsgleyeykzje.supabase.co"
          echo "== novinky anon"; curl -s -m 20 -H "apikey: $K" "$U/rest/v1/app_novinky?select=titul,d&order=d.desc&limit=3"; echo
          echo "== FinStat api detail (bez kľúča)"; curl -s -m 20 -D - -H "$H" -X POST "https://www.finstat.sk/api/detail" -d "ico=$ICO" | head -c 1500; echo
          } > out.txt 2>&1
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ico-results; git rm -rfq . >/dev/null; git add out.txt; git commit -qm ico; git push -fq origin ico-results
