name: burza-probe
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/burza
      - run: python3 .github/burza/probe.py > probe.txt 2>&1; cat probe.txt
      - run: |
          git init -q p && cp probe.txt p/ && cd p && git checkout -q -b burza-probe && git config user.name bot && git config user.email bot@users.noreply.github.com && git add probe.txt && git commit -qm probe && git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" burza-probe
