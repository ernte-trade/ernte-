# 📈 História burzy MATIF / CBOT (~100 dní, AHDB + bot) pre graf na úvode (farmár) – vetva burza-hist / hist.json, každý pracovný deň po uzávierke
name: burza-hist
on:
  schedule:
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [ernte-burza-hist]
permissions:
  contents: write
jobs:
  h:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            .github/burza
            farmar/market.json
          sparse-checkout-cone-mode: false
      - name: Stiahnuť históriu burzy
        run: |
          python3 .github/burza/hist.py && mkdir -p o && mv hist.json o/ && cd o
          test -s hist.json
          git init -q; git checkout -q -b burza-hist
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add hist.json; git commit -qm "burza $(date -u +%F)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" burza-hist
